/* Shared failure path for the multi-step quiz insert. */
function vals_publishFail(overlay, user){
  overlay.remove();
  toast('Could not publish the quiz. Please try again.');
  renderPage();
}
function openCreateQuizModal(user){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box qb-modal">
      <button class="modal-close" id="mClose">${icon('xmark')}</button>
      <div id="qbContent">
        <h3>Create a quiz</h3>
        <div class="field"><label>Title</label><input type="text" id="quizTitle" placeholder="e.g. Chapter 4 Vocabulary Quiz"></div>
        <div class="field"><label>Subject</label><select id="quizSubject">${(user.role==='teacher'?[user.subject]:SUBJECTS).map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>
        <div class="field-row">
          <div class="field"><label>Grade</label><select id="quizGrade">${GRADES.map(g=>`<option value="${g}">Grade ${g}</option>`).join('')}</select></div>
          <div class="field"><label>Section</label><select id="quizSection">${SECTIONS.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>
        </div>
        <div id="qbQuestions"></div>
        <button type="button" class="add-question-btn" id="qbAddQuestion">${icon('plus')} Add question</button>
        <div class="form-error" id="qbError"></div>
        <button class="btn btn-fill-red" id="qbPublish" style="margin-top:14px;">Publish quiz</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('mClose').onclick = ()=> overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

  let qCounter = 0;
  const qContainer = document.getElementById('qbQuestions');

  function optionRowHtml(qid, idx, checked){
    return `<div class="q-opt-row">
      <input type="radio" name="correct-${qid}" class="opt-correct" ${checked?'checked':''}>
      <input type="text" class="opt-text" placeholder="Option ${idx+1}">
      <button type="button" class="cdel remove-option">${icon('xmark')}</button>
    </div>`;
  }
  function renderQuestionBody(blockEl, type){
    const body = blockEl.querySelector('.q-body');
    if(type==='mcq'){
      body.innerHTML = `
        <div class="q-options">
          ${optionRowHtml(blockEl.dataset.qid,0,true)}
          ${optionRowHtml(blockEl.dataset.qid,1,false)}
        </div>
        <button type="button" class="add-option-btn">${icon('plus')} Add option</button>`;
    } else if(type==='truefalse'){
      body.innerHTML = `<div class="field"><label>Correct answer</label>
        <select class="tf-correct"><option value="true">True</option><option value="false">False</option></select>
      </div>`;
    } else {
      body.innerHTML = `<div class="field"><label>Correct answer (exact text)</label><input type="text" class="short-correct" placeholder="e.g. Baghdad"></div>`;
    }
  }
  function renumberQuestions(){
    [...qContainer.children].forEach((el,i)=>{
      el.querySelector('.quiz-qhead b').textContent = 'Question '+(i+1);
    });
  }
  function addQuestionBlock(){
    qCounter++;
    const qid = 'q'+qCounter;
    const div = document.createElement('div');
    div.className = 'quiz-qblock';
    div.dataset.qid = qid;
    div.innerHTML = `
      <div class="quiz-qhead">
        <b>Question</b>
        <button type="button" class="cdel" data-removeq="${qid}">${icon('trash')}</button>
      </div>
      <div class="field"><label>Question text</label><input type="text" class="q-text" placeholder="Type the question..."></div>
      <div class="field"><label>Type</label>
        <select class="q-type">
          <option value="mcq">Multiple choice</option>
          <option value="truefalse">True / False</option>
          <option value="short">Short answer</option>
        </select>
      </div>
      <div class="q-body"></div>`;
    qContainer.appendChild(div);
    renumberQuestions();
    div.querySelector('.q-type').onchange = (e)=> renderQuestionBody(div, e.target.value);
    renderQuestionBody(div, 'mcq');
  }

  qContainer.addEventListener('click', (e)=>{
    if(e.target.closest('.add-option-btn')){
      const block = e.target.closest('.quiz-qblock');
      const optsDiv = block.querySelector('.q-options');
      if(optsDiv.children.length>=6) return;
      optsDiv.insertAdjacentHTML('beforeend', optionRowHtml(block.dataset.qid, optsDiv.children.length, false));
      return;
    }
    if(e.target.closest('.remove-option')){
      const optsDiv = e.target.closest('.q-options');
      if(optsDiv.children.length<=2) return;
      e.target.closest('.q-opt-row').remove();
      return;
    }
    const removeBtn = e.target.closest('[data-removeq]');
    if(removeBtn){
      removeBtn.closest('.quiz-qblock').remove();
      renumberQuestions();
    }
  });

  document.getElementById('qbAddQuestion').onclick = addQuestionBlock;
  addQuestionBlock();

  document.getElementById('qbPublish').onclick = ()=>{
    const title = document.getElementById('quizTitle').value.trim();
    const subject = document.getElementById('quizSubject').value;
    const grade = document.getElementById('quizGrade').value;
    const section = document.getElementById('quizSection').value;
    const err = document.getElementById('qbError');
    err.style.display='none';
    if(!title){ err.textContent='Please give the quiz a title.'; err.style.display='block'; return; }
    const blocks = [...qContainer.children];
    if(blocks.length===0){ err.textContent='Add at least one question.'; err.style.display='block'; return; }
    const questions = [];
    for(let i=0;i<blocks.length;i++){
      const b = blocks[i];
      const text = b.querySelector('.q-text').value.trim();
      const type = b.querySelector('.q-type').value;
      if(!text){ err.textContent = `Question ${i+1} needs question text.`; err.style.display='block'; return; }
      if(type==='mcq'){
        const rows = [...b.querySelectorAll('.q-opt-row')];
        const options = rows.map((r,oi)=>({id:'o'+oi, text:r.querySelector('.opt-text').value.trim()}));
        if(options.some(o=>!o.text)){ err.textContent = `Question ${i+1} has an empty answer option.`; err.style.display='block'; return; }
        const correctIdx = rows.findIndex(r=>r.querySelector('.opt-correct').checked);
        if(correctIdx===-1){ err.textContent = `Question ${i+1} needs a correct answer selected.`; err.style.display='block'; return; }
        questions.push({ id:uid(), text, type:'mcq', options, correctOptionId: options[correctIdx].id });
      } else if(type==='truefalse'){
        const tfCorrect = b.querySelector('.tf-correct').value === 'true';
        questions.push({ id:uid(), text, type:'truefalse', tfCorrect });
      } else {
        const shortCorrect = b.querySelector('.short-correct').value.trim();
        if(!shortCorrect){ err.textContent = `Question ${i+1} needs a correct answer.`; err.style.display='block'; return; }
        questions.push({ id:uid(), text, type:'short', shortCorrect });
      }
    }
    document.getElementById('qbContent').innerHTML = `
      <div class="loading-wrap">
        <div class="spinner"></div>
        <p>Publishing quiz...</p>
      </div>`;
    setTimeout(async ()=>{
      /* quizzes -> quiz_questions -> quiz_options, matching the normalised schema. */
      const {data:qz, error:qErr} = await sb.from('quizzes').insert({
        title, subject, grade: parseInt(grade,10), section,
        created_by: user.id, created_by_name: user.name, created_by_role: user.role
      }).select().single();
      if(qErr){ vals_publishFail(overlay, user); return; }

      const qRows = questions.map((q,idx)=>({
        quiz_id: qz.id, position: idx+1, text: q.text, type: q.type,
        tf_correct: q.type==='truefalse' ? q.tfCorrect : null,
        short_correct: q.type==='short' ? q.shortCorrect : null
      }));
      const {data:qqs, error:qqErr} = await sb.from('quiz_questions').insert(qRows).select();
      if(qqErr){
        await sb.from('quizzes').delete().eq('id', qz.id);   // roll back the parent
        vals_publishFail(overlay, user); return;
      }

      const byPos = {}; (qqs||[]).forEach(r=>{ byPos[r.position] = r; });
      const optRows = [];
      questions.forEach((q,idx)=>{
        if(q.type!=='mcq') return;
        const parent = byPos[idx+1];
        q.options.forEach((o,oi)=>{
          optRows.push({ question_id: parent.id, position: oi+1, text: o.text,
                         is_correct: o.id===q.correctOptionId });
        });
      });
      if(optRows.length){
        const {error:optErr} = await sb.from('quiz_options').insert(optRows);
        if(optErr){
          await sb.from('quizzes').delete().eq('id', qz.id);
          vals_publishFail(overlay, user); return;
        }
      }

      /* Re-read the quiz so the cache holds real server-side IDs. */
      const {data:full} = await sb.from('quizzes')
        .select('*, quiz_questions(*, quiz_options(*))').eq('id', qz.id).single();
      if(full) DB.quizzes.push(mapQuiz(full));
      overlay.remove();
      toast('Quiz published.');
      renderPage();
    }, 1200);
  };
}

function pageQuizTake(user, quiz){
  const qs = quiz.questions.map((q,i)=>{
    if(q.type==='mcq'){
      return `<div class="quiz-take-q" data-qid="${q.id}">

      </div>`;
    } else if(q.type==='truefalse'){

        <div class="qt-title">${i+1}. ${escapeHtml(q.text)}</div>
        <label class="qt-option"><input type="radio" name="take-${q.id}" value="true"><span>True</span></label>
        <label class="qt-option"><input type="radio" name="take-${q.id}" value="false"><span>False</span></label>
      </div>`;
    }
    return `<div class="quiz-take-q" data-qid="${q.id}">
      <div class="qt-title">${i+1}. ${escapeHtml(q.text)}</div>
      <input type="text" class="qt-short-input" data-short placeholder="Your answer">
    </div>`;
  }).join('');
  return `
    <button class="back-link" id="quizBack">${icon('arrow-left')} Back</button>
    <div class="panel">
      <h2 style="color:var(--red);margin:0 0 4px;">${escapeHtml(quiz.title)}</h2>
      <div class="sub">${escapeHtml(quiz.subject)} &middot; ${quiz.questions.length} question${quiz.questions.length!==1?'s':''}</div>
    </div>
    <div class="panel">
      ${qs}
      <div class="form-error" id="quizTakeError"></div>
      <button class="btn btn-fill-red" id="quizSubmit">Submit quiz</button>
    </div>`;
}
function bindQuizTake(user, quiz){
  document.getElementById('quizBack').onclick = ()=>{ viewingQuizId=null; quizMode=null; renderPage(); };
  document.getElementById('quizSubmit').onclick = async ()=>{
    const err = document.getElementById('quizTakeError');
    const answers = [];
    for(const q of quiz.questions){
      const block = document.querySelector(`[data-qid="${q.id}"]`);
      let given;
      if(q.type==='short'){
        given = block.querySelector('[data-short]').value.trim();
        if(!given){ err.textContent = 'Please answer every question before submitting.'; err.style.display='block'; return; }
      } else {
        const checked = block.querySelector('input[type=radio]:checked');
        if(!checked){ err.textContent = 'Please answer every question before submitting.'; err.style.display='block'; return; }
        given = checked.value;
      }
      answers.push({questionId:q.id, given});
    }
    let score = 0;
    quiz.questions.forEach(q=>{
      const a = answers.find(x=>x.questionId===q.id);
      if(q.type==='mcq'){ if(a.given===q.correctOptionId) score++; }
      else if(q.type==='truefalse'){ if(a.given===String(q.tfCorrect)) score++; }
      else { if(a.given.toLowerCase()===String(q.shortCorrect||'').trim().toLowerCase()) score++; }
    });
    const btn = document.getElementById('quizSubmit');
    btn.disabled = true; btn.textContent = 'Submitting...';
    const {data:att, error:attErr} = await sb.from('quiz_attempts').insert({
      quiz_id: quiz.id, student_id: user.id, student_name: user.name,
      score, total: quiz.questions.length
    }).select().single();
    if(attErr){
      btn.disabled = false; btn.textContent = 'Submit quiz';
      err.textContent = (attErr.code==='23505')
        ? 'You have already submitted this quiz.'
        : 'Could not submit. Please try again.';
      err.style.display = 'block';
      return;
    }
    const ansRows = quiz.questions.map(q=>{
      const a = answers.find(x=>x.questionId===q.id);
      const row = { attempt_id: att.id, question_id: q.id,
                    selected_option_id: null, given_bool: null, given_text: null,
                    is_correct: false };
      if(q.type==='mcq'){
        row.selected_option_id = a.given;
        row.is_correct = a.given===q.correctOptionId;
      } else if(q.type==='truefalse'){
        row.given_bool = a.given==='true';
        row.is_correct = a.given===String(q.tfCorrect);
      } else {
        row.given_text = a.given;
        row.is_correct = a.given.toLowerCase()===String(q.shortCorrect||'').trim().toLowerCase();
      }
      return row;
    });
    const {error:ansErr} = await sb.from('quiz_answers').insert(ansRows);
    if(ansErr) sbFail('saveQuizAnswers', ansErr);
    DB.quizAttempts.push({ id:att.id, quizId:quiz.id, studentId:user.id, studentName:user.name,
                           answers, score, total:quiz.questions.length, submittedAt:tsToMs(att.submitted_at) });
    toast(`Quiz submitted! Score: ${score}/${quiz.questions.length}`);
    quizMode = 'review';
    renderPage();
  };
}
function renderQuizAnswerBreakdown(quiz, attempt){
  return quiz.questions.map((q,i)=>{
    const a = attempt.answers.find(x=>x.questionId===q.id) || {given:null};
    let bodyHtml = '';
    if(q.type==='mcq'){
      bodyHtml = q.options.map(o=>{
        let cls = '';
        if(o.id===q.correctOptionId) cls='correct';
        else if(o.id===a.given) cls='wrong';
        return `<div class="qt-option ${cls}"><span>${escapeHtml(o.text)}</span></div>`;
      }).join('');
    } else if(q.type==='truefalse'){
      bodyHtml = ['true','false'].map(v=>{
        let cls='';
        if(v===String(q.tfCorrect)) cls='correct';
        else if(v===a.given) cls='wrong';
        return `<div class="qt-option ${cls}"><span>${v==='true'?'True':'False'}</span></div>`;
      }).join('');
    } else {
      const isRight = (a.given||'').toLowerCase()===String(q.shortCorrect||'').trim().toLowerCase();
      bodyHtml = `<div class="qt-option ${isRight?'correct':'wrong'}"><span>Answer given: ${escapeHtml(a.given||'(blank)')}</span></div>
        ${!isRight? `<div class="qt-option correct"><span>Correct answer: ${escapeHtml(q.shortCorrect||'')}</span></div>`:''}`;
    }
    return `<div class="quiz-take-q"><div class="qt-title">${i+1}. ${escapeHtml(q.text)}</div>${bodyHtml}</div>`;
  }).join('');
}

/* ---------- CLASS GROUPCHAT ---------- */
/* One shared chat per grade+section. Only students in that class can send;
   staff get a read-only list of every class's chat for oversight and can
   remove messages, but can't post. Teachers aren't part of this at all --
   it's meant as a student-to-student channel. Messages fade out of view
   after 24 hours unless someone saves them (any classmate can save any
   message, Snapchat-style, so nothing important is lost by accident). */
let classChatBrowse = null; // {grade,section} -- which class staff are viewing
function classChatKey(grade,section){ return grade+'_'+section; }
function visibleClassChatMessages(grade, section){
  const cutoff = Date.now() - 24*3600*1000;
  return DB.chatMessages
    .filter(m=>String(m.grade)===String(grade) && m.section===section && (m.createdAt>cutoff || m.saved))
    .sort((a,b)=>a.createdAt-b.createdAt);
}
function chatMessageBubble(m, user, showSaveToggle){
  const canDelete = m.senderId===user.id || isStaff(user);
  return `<div class="comment">
    <div class="cavatar">${m.senderName.slice(0,2).toUpperCase()}</div>
    <div class="cbody">
      <div class="cname">${escapeHtml(m.senderName)} ${m.saved? `<span class="tag" style="background:var(--yellow-soft);color:#7a5a05;">${icon('pin')} Saved</span>`:''}</div>
      ${m.text? `<div class="ctext">${linkifyText(m.text)}</div>`:''}
      ${mediaHtml(m.mediaUrl, m.mediaType, 'chat-media')}
      <div class="ctime">${new Date(m.createdAt).toLocaleString()}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;">
      ${showSaveToggle? `<button class="cdel" data-savechat="${m.id}" title="${m.saved?'Unsave':'Save so it stays'}">${icon('pin')}</button>`:''}
      ${canDelete? `<button class="cdel" data-delchat="${m.id}" title="Delete">${icon('trash')}</button>`:''}
    </div>
  </div>`;
}
function pageClassChat(user){
  if(user.role==='teacher'){
    return `<div class="panel">${emptyState('chat','Class chat is a student &amp; staff space.')}</div>`;
  }
  if(isStaff(user)){
    if(!classChatBrowse){
      const active = {};
      DB.chatMessages.forEach(m=>{
        const k = classChatKey(m.grade,m.section);
        active[k] = active[k] || {grade:m.grade, section:m.section, count:0, last:0};
        active[k].count++;
        active[k].last = Math.max(active[k].last, m.createdAt);
      });
      const list = Object.values(active).sort((a,b)=>b.last-a.last);
      return `
        <div class="page-header"><div><h2>Class Chats</h2><div class="sub">Every class's group chat, for oversight.</div></div></div>
        <div class="panel">
          ${list.length? list.map(c=>`
            <button class="live-card" data-viewchat="${c.grade}_${c.section}">
              <div class="live-icon">${icon('chat')}</div>
              <div class="live-main">
                <div class="live-title">Grade ${c.grade} &middot; Section ${c.section}</div>
                <div class="live-meta">${c.count} message${c.count!==1?'s':''} &middot; last active ${new Date(c.last).toLocaleString()}</div>
              </div>
              ${icon('chevron-right')}
            </button>`).join('') : emptyState('chat','No class chats have any activity yet.')}
        </div>`;
    }
    const {grade, section} = classChatBrowse;
    const msgs = visibleClassChatMessages(grade, section);
    return `
      <button class="back-link" id="chatBack">${icon('arrow-left')} All class chats</button>
      <div class="panel">
        <h3>Grade ${grade} &middot; Section ${section}</h3>
        <div class="sub" style="margin:-6px 0 14px;">Viewing only &mdash; staff can't send messages here, but can remove any for moderation.</div>
        <div class="chat-thread">${msgs.length? msgs.map(m=>chatMessageBubble(m,user,false)).join('') : emptyState('chat','No messages in the last 24 hours.')}</div>
      </div>`;
  }
  const grade = user.grade, section = user.section;
  const msgs = visibleClassChatMessages(grade, section);
  return `
    <div class="page-header"><div><h2>Class Chat</h2><div class="sub">Grade ${escapeHtml(String(grade))}, Section ${escapeHtml(section)} &middot; messages fade out after 24 hours unless saved.</div></div></div>
    <div class="panel">
      <div class="chat-thread">${msgs.length? msgs.map(m=>chatMessageBubble(m,user,true)).join('') : emptyState('chat','No messages yet &mdash; say hi!')}</div>
      <div class="add-comment-row">
        <button class="mini-btn" id="chatAttachBtn" title="Attach photo/video">${icon('paperclip')}</button>
        <input type="text" id="chatInput" placeholder="Message your class...">
        <button class="btn btn-fill-yellow btn-sm" id="chatSend">Send</button>
      </div>
      <input type="file" id="chatMediaInput" accept="image/*,video/*" style="display:none;">
      <div id="chatMediaStatus" style="font-size:12px;color:var(--ink-soft);margin-top:6px;"></div>
    </div>`;
}
function bindClassChat(user){
  if(user.role==='teacher') return;
  if(isStaff(user)){
    if(!classChatBrowse){
      document.querySelectorAll('[data-viewchat]').forEach(el=>{
        el.onclick = ()=>{
          const [g,s] = el.dataset.viewchat.split('_');
          classChatBrowse = {grade:g, section:s};
          renderPage();
        };
      });
      return;
    }
    document.getElementById('chatBack').onclick = ()=>{ classChatBrowse=null; renderPage(); };
    document.querySelectorAll('[data-delchat]').forEach(el=>{
      el.onclick = async ()=>{
        const mid = el.dataset.delchat;
        const {error} = await sb.from('class_chat_messages').delete().eq('id', mid);
        if(error){ sbFail('deleteChatMessage', error); return; }
        DB.chatMessages = DB.chatMessages.filter(m=>m.id!==mid);
        renderPage();
      };
    });
    return;
  }
  let pendingMedia = null;
  const mediaInput = document.getElementById('chatMediaInput');
  const attachBtn = document.getElementById('chatAttachBtn');
  if(attachBtn) attachBtn.onclick = ()=> mediaInput.click();
  if(mediaInput) mediaInput.onchange = async ()=>{
    const status = document.getElementById('chatMediaStatus');
    try{
      pendingMedia = await pickMediaFile(mediaInput.files[0]);
      status.textContent = `${pendingMedia.type==='video'?'Video':'Photo'} attached -- will send with your next message.`;
      status.style.color = 'var(--red)';
    } catch(e){ status.textContent = e.message; status.style.color='var(--red)'; pendingMedia=null; }
  };
  const sendBtn = document.getElementById('chatSend');
  if(sendBtn) sendBtn.onclick = async ()=>{
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text && !pendingMedia) return;
    sendBtn.disabled = true;
    const {data, error} = await sb.from('class_chat_messages').insert({
      grade: user.grade, section: user.section, sender_id: user.id, sender_name: user.name,
      body: text || null, media_url: pendingMedia? pendingMedia.dataUrl : null,
      media_type: pendingMedia? pendingMedia.type : null, saved:false
    }).select().single();
    sendBtn.disabled = false;
    if(error){ sbFail('sendChatMessage', error); return; }
    const m = mapChatMessage(data);
    if(!DB.chatMessages.some(x=>x.id===m.id)) DB.chatMessages.push(m);
    input.value=''; pendingMedia=null;
    renderPage();
  };
  document.querySelectorAll('[data-savechat]').forEach(el=>{
    el.onclick = async ()=>{
      const mid = el.dataset.savechat;
      const msg = DB.chatMessages.find(x=>x.id===mid);
      if(!msg) return;
      const nextSaved = !msg.saved;
      const {error} = await sb.from('class_chat_messages').update({saved:nextSaved}).eq('id', mid);
      if(error){ sbFail('saveChatMessage', error); return; }
      msg.saved = nextSaved;
      renderPage();
    };
  });
  document.querySelectorAll('[data-delchat]').forEach(el=>{
    el.onclick = async ()=>{
      const mid = el.dataset.delchat;
      const {error} = await sb.from('class_chat_messages').delete().eq('id', mid);
      if(error){ sbFail('deleteChatMessage', error); return; }
      DB.chatMessages = DB.chatMessages.filter(m=>m.id!==mid);
      renderPage();
    };
  });
}

/* ---------- HOMEWORK PROOF STATION + RONACOINS ---------- */
/* A private mailbox: a student sends a photo/video as proof they did their
   homework, the teacher reviews it and can award up to 50 RonaCoins.
   Staff can see every thread for oversight but can't send. */
const MAX_COINS_PER_AWARD = 50;

function myProofThreads(user){
  if(user.role==='student') return DB.proofThreads.filter(t=>t.studentId===user.id);
  if(user.role==='teacher') return DB.proofThreads.filter(t=>t.teacherId===user.id);
  return DB.proofThreads; // staff oversight: every thread
}
function proofThreadLastMessage(threadId){
  const msgs = DB.proofMessages.filter(m=>m.threadId===threadId).sort((a,b)=>b.createdAt-a.createdAt);
  return msgs[0] || null;
}
function proofThreadCoinsTotal(threadId){
  return DB.proofMessages.filter(m=>m.threadId===threadId && m.coinsAwarded)
    .reduce((s,m)=>s+(m.coinsAwarded||0), 0);
}
function pageProofStation(user){
  const threads = [...myProofThreads(user)].sort((a,b)=>b.lastMessageAt-a.lastMessageAt);
  const canStart = user.role==='student';
  return `
    <div class="page-header">
      <div><h2>Homework Proof</h2><div class="sub">${
        user.role==='student' ? 'Send proof you did your homework and earn RonaCoins.'
        : isStaff(user) ? 'Every proof conversation, for oversight.'
        : 'Review the proof your students send you.'
      }</div></div>
      ${canStart? `<button class="fab-yellow" id="btnNewProof" title="Send proof">${icon('plus')}</button>`:''}
    </div>
    <div class="panel">
      ${threads.length? threads.map(t=>proofThreadRow(t,user)).join('') : emptyState('camera', canStart? "Nothing sent yet -- tap + to send your first proof." : 'No proof submissions yet.')}
    </div>`;
}
function proofThreadRow(t,user){
  const last = proofThreadLastMessage(t.id);
  const coins = proofThreadCoinsTotal(t.id);
  let title;
  if(user.role==='student') title = `To ${escapeHtml(t.teacherName)}`;
  else if(user.role==='teacher') title = `From ${escapeHtml(t.studentName)}`;
  else title = `${escapeHtml(t.studentName)} &rarr; ${escapeHtml(t.teacherName)}`;
  const preview = last ? (last.text ? escapeHtml(last.text.slice(0,60)) : (last.mediaType==='video'?'Video attached':'Photo attached')) : 'No messages yet';
  return `<button class="live-card" data-openproof="${t.id}">
    <div class="live-icon">${icon('camera')}</div>
    <div class="live-main">
      <div class="live-title">${title}</div>
      <div class="live-meta">${preview} &middot; ${new Date(t.lastMessageAt).toLocaleString()}</div>
    </div>
    ${coins>0? `<div class="quiz-score-pill">${icon('coin')} ${coins}</div>`:''}
    ${icon('chevron-right')}
  </button>`;
}
function bindProofStation(user){

    if(!media){ err.textContent='Attach a photo or video as proof first.'; err.style.display='block'; return; }
    const teacher = teachers.find(t=>t.id===teacherId);
    const btn = document.getElementById('proofNewSend');
    btn.disabled = true;

    let thread = DB.proofThreads.find(t=>t.studentId===user.id && t.teacherId===teacherId);
    if(!thread){
      const {data, error} = await sb.from('homework_proof_threads').insert({
        student_id: user.id, student_name: user.name, teacher_id: teacherId, teacher_name: teacher.name
      }).select().single();
      if(error){ btn.disabled=false; sbFail('createProofThread', error); return; }
      thread = mapProofThread(data);
      DB.proofThreads.push(thread);
    }
    const {data:msgData, error:msgErr} = await sb.from('homework_proof_messages').insert({
      thread_id: thread.id, sender_id:user.id, sender_name:user.name, sender_role:user.role,
      body: caption || null, media_url: media.dataUrl, media_type: media.type
    }).select().single();
    btn.disabled = false;
    if(msgErr){ sbFail('sendProofMessage', msgErr); return; }
    DB.proofMessages.push(mapProofMessage(msgData));
    thread.lastMessageAt = Date.now();
    sb.from('homework_proof_threads').update({last_message_at:new Date().toISOString()}).eq('id', thread.id)
      .then(({error})=>{ if(error) console.error('[Supabase] touchProofThread', error); });
    overlay.remove();
    toast('Proof sent!');
    viewingProofThreadId = thread.id;
    renderPage();
  };
}
function proofMessageBubble(m){
  return `<div class="comment">
    <div class="cavatar">${m.senderName.slice(0,2).toUpperCase()}</div>
    <div class="cbody">
      <div class="cname">${nameWithBadge(m.senderName, m.senderRole)}</div>
      ${m.text? `<div class="ctext">${linkifyText(m.text)}</div>`:''}
      ${mediaHtml(m.mediaUrl, m.mediaType, 'chat-media')}
      ${m.coinsAwarded? `<div class="tag" style="background:var(--yellow);color:var(--red-dark);margin-top:6px;">${icon('coin')} +${m.coinsAwarded} RonaCoins</div>`:''}
      <div class="ctime">${new Date(m.createdAt).toLocaleString()}</div>

}
function pageProofThread(user, threadId){

  const canReply = (user.role==='teacher' && t.teacherId===user.id) || (user.role==='student' && t.studentId===user.id);
  const isViewerOnly = isStaff(user) && !canReply;
  const msgs = DB.proofMessages.filter(m=>m.threadId===threadId).sort((a,b)=>a.createdAt-b.createdAt);
  return `

    <div class="panel">
      <h3>${escapeHtml(t.studentName)} &harr; ${escapeHtml(t.teacherName)}</h3>
      <div class="sub" style="margin:-6px 0 14px;">Private &mdash; only ${escapeHtml(t.studentName)}, ${escapeHtml(t.teacherName)}, and staff can see this.</div>
      <div class="chat-thread">${msgs.length? msgs.map(m=>proofMessageBubble(m)).join('') : emptyState('camera','No messages yet.')}</div>
      ${canReply? `
        ${user.role==='teacher' ? `
        <div class="field" style="margin-top:14px;max-width:220px;">
          <label>Award RonaCoins (0-${MAX_COINS_PER_AWARD})</label>
          <input type="number" id="proofCoins" min="0" max="${MAX_COINS_PER_AWARD}" value="0" style="width:100%;padding:10px 12px;border-radius:var(--r-sm);border:2px solid var(--line);font-size:14px;">
        </div>`:''}
        <div class="add-comment-row">
          <button class="mini-btn" id="proofAttachBtn" title="Attach photo/video">${icon('paperclip')}</button>
          <input type="text" id="proofInput" placeholder="${user.role==='student'?'Add a caption...':'Write a reply...'}">
          <button class="btn btn-fill-yellow btn-sm" id="proofSend">Send</button>
        </div>
        <input type="file" id="proofMediaInput" accept="image/*,video/*" style="display:none;">
        <div id="proofMediaStatus" style="font-size:12px;color:var(--ink-soft);margin-top:6px;"></div>
      ` : isViewerOnly? `<div class="sub" style="margin-top:14px;">Staff view only &mdash; you can't send messages here.</div>` : ''}

function bindProofThread(user){
  document.getElementById('proofBack').onclick = ()=>{ viewingProofThreadId=null; renderPage(); };
  const t = DB.proofThreads.find(x=>x.id===viewingProofThreadId);
  if(!t) return;
  const canReply = (user.role==='teacher' && t.teacherId===user.id) || (user.role==='student' && t.studentId===user.id);
  if(!canReply) return;

  let pendingMedia = null;
  const mediaInput = document.getElementById('proofMediaInput');
  const attachBtn = document.getElementById('proofAttachBtn');
  if(attachBtn) attachBtn.onclick = ()=> mediaInput.click();
  if(mediaInput) mediaInput.onchange = async ()=>{
    const status = document.getElementById('proofMediaStatus');
    try{
      pendingMedia = await pickMediaFile(mediaInput.files[0]);
      status.textContent = `${pendingMedia.type==='video'?'Video':'Photo'} attached.`;
      status.style.color = 'var(--red)';
    } catch(e){ status.textContent = e.message; status.style.color='var(--red)'; pendingMedia=null; }
  };

  const sendBtn = document.getElementById('proofSend');
  if(sendBtn) sendBtn.onclick = async ()=>{
    const input = document.getElementById('proofInput');
    const text = input.value.trim();
    const coinsInput = document.getElementById('proofCoins');
    const coins = coinsInput ? Math.max(0, Math.min(MAX_COINS_PER_AWARD, parseInt(coinsInput.value,10)||0)) : 0;
    if(!text && !pendingMedia && !coins){ toast('Write a message, attach media, or award coins first.'); return; }
    sendBtn.disabled = true;
    const {data, error} = await sb.from('homework_proof_messages').insert({
      thread_id: t.id, sender_id:user.id, sender_name:user.name, sender_role:user.role,
      body: text || null, media_url: pendingMedia? pendingMedia.dataUrl : null,
      media_type: pendingMedia? pendingMedia.type : null,
      coins_awarded: coins>0 ? coins : null
    }).select().single();
    sendBtn.disabled = false;
    if(error){ sbFail('sendProofReply', error); return; }
    DB.proofMessages.push(mapProofMessage(data));
    t.lastMessageAt = Date.now();
    sb.from('homework_proof_threads').update({last_message_at:new Date().toISOString()}).eq('id', t.id)
      .then(({error})=>{ if(error) console.error('[Supabase] touchProofThread', error); });

    if(coins>0){
      const student = DB.users.find(u=>u.id===t.studentId);
      if(student){
        const newTotal = (student.coins||0) + coins;
        const {error:coinErr} = await sb.from('users').update({coins:newTotal}).eq('id', student.id);
        if(!coinErr) student.coins = newTotal;
        else console.error('[Supabase] awardCoins', coinErr);
      }
      toast(`Sent and awarded ${coins} RonaCoins!`);
    } else {
      toast('Sent.');
    }
    input.value=''; pendingMedia=null;
    renderPage();
  };
}

const SHOP_BACKGROUNDS = [
  {key:'galaxy', name:'Galaxy', price:150},
  {key:'sunset', name:'Sunset', price:120},
  {key:'ocean',  name:'Ocean',  price:120},
  {key:'forest', name:'Forest', price:100},
];
const SHOP_FONTS = [
  {key:'rounded', name:'Playful Rounded', price:80},
  {key:'bold',    name:'Bold Impact',     price:80},
  {key:'italic',  name:'Elegant Italic',  price:80},
  {key:'serif',   name:'Classic Serif',   price:80},
];
const AVATAR_PRICE = 100;
const COLOR_UNLOCK_PRICE = 200;

function ownsItem(user, key){ return DB.shopPurchases.some(p=>p.userId===user.id && p.itemKey===key); }

/* Applies whatever the signed-in user has equipped -- purely visual, and
   only ever touches this browser's view of the app, never anyone else's. */
function applyPersonalization(user){
  const root = document.documentElement;
  if(user && user.colorsUnlocked && user.customColors){
    root.style.setProperty('--red', user.customColors.red || '#8A1F1F');
    root.style.setProperty('--red-dark', user.customColors.red2 || '#651414');
    root.style.setProperty('--yellow', user.customColors.yellow || '#F0B815');
  } else {
    root.style.removeProperty('--red');
    root.style.removeProperty('--red-dark');
    root.style.removeProperty('--yellow');
  }
  document.body.classList.remove('theme-galaxy','theme-sunset','theme-ocean','theme-forest');
  if(user && user.equippedBackground) document.body.classList.add('theme-'+user.equippedBackground);
  document.body.classList.remove('font-rounded','font-bold','font-italic','font-serif');
  if(user && user.equippedFont) document.body.classList.add('font-'+user.equippedFont);
}
async function purchaseShopItem(user, key, price, label){
  if(ownsItem(user,key)){ toast('You already own this.'); return true; }
  if((user.coins||0) < price){ toast(`Not enough RonaCoins -- you need ${price}.`); return false; }
  const newTotal = user.coins - price;
  const {error:coinErr} = await sb.from('users').update({coins:newTotal}).eq('id', user.id);
  if(coinErr){ sbFail('purchaseDeductCoins', coinErr); return false; }
  const {data, error} = await sb.from('shop_purchases').insert({user_id:user.id, item_key:key, price_paid:price}).select().single();
  if(error){
    await sb.from('users').update({coins:user.coins}).eq('id', user.id); // roll back
    sbFail('purchaseShopItem', error); return false;
  }
  user.coins = newTotal;
  DB.shopPurchases.push(mapShopPurchase(data));
  toast(`Bought ${label}!`);
  return true;
}
async function equipBackground(user, key){
  const {error} = await sb.from('users').update({equipped_background:key}).eq('id', user.id);
  if(error){ sbFail('equipBackground', error); return; }
  user.equippedBackground = key;
  applyPersonalization(user);
  renderPage();
}
async function equipFont(user, key){
  const {error} = await sb.from('users').update({equipped_font:key}).eq('id', user.id);
  if(error){ sbFail('equipFont', error); return; }
  user.equippedFont = key;
  applyPersonalization(user);
  renderPage();
}
function shopItemCard(user, kind, item){
  const owned = ownsItem(user, item.key);
  const equipped = kind==='background' ? user.equippedBackground===item.key : user.equippedFont===item.key;
  const swatchContent = kind==='font' ? 'Aa' : '';
  return `<div class="shop-card ${equipped?'equipped':''}">
    <div class="shop-swatch swatch-${kind}-${item.key}">${swatchContent}</div>
    <div class="shop-name">${item.name}</div>
    ${owned
      ? `<button class="btn btn-sm ${equipped?'btn-fill-yellow':'btn-outline-red'}" data-equip="${kind}:${item.key}" ${equipped?'disabled':''}>${equipped?'Equipped':'Equip'}</button>`
      : `<button class="btn btn-fill-red btn-sm" data-buy="${kind}:${item.key}:${item.price}">${icon('coin')} ${item.price}</button>`}
  </div>`;
}
function shopDefaultCard(user, kind){
  const equipped = kind==='background' ? !user.equippedBackground : !user.equippedFont;

    <div class="shop-swatch swatch-default">${kind==='font'?'Aa':''}</div>

}

function bindShop(user){
  document.querySelectorAll('[data-buy]').forEach(el=>{

/* ---------- SCHEDULE ---------- */
/* Every class (grade+section) has its own schedule now. Students are locked
   to their own class; teachers and staff can browse any class via the
   switcher at the top right, and only staff can edit. */
let scheduleView = null; // {grade, section} -- set lazily per user below
function scheduleKey(grade, section, day, period){ return `${grade}_${section}_${day}_${period}`; }
function ensureScheduleView(user){
  if(scheduleView) return;
  if(user.role==='student') scheduleView = { grade: user.grade, section: user.section };
  else scheduleView = { grade: 1, section: 'A' };
}
function pageSchedule(user){
  ensureScheduleView(user);
  const canEdit = isStaff(user);
  const canBrowse = user.role!=='student';
  const {grade, section} = scheduleView;

  let grid = `<div class="schedule-grid">`;
  grid += `<div></div>` + DAYS.map(d=>`<div class="sched-head">${d}</div>`).join('');
  LESSONS.forEach(lesson=>{
    grid += `<div class="sched-lesson-lbl">L${lesson}</div>`;
    DAYS.forEach(day=>{
      const key = scheduleKey(grade, section, day, lesson);
      const cell = DB.schedule[key];
      grid += `<div class="sched-cell ${canEdit?'editable':''}" data-key="${key}">
        ${cell? `<div class="csub">${escapeHtml(cell.subject)}</div><div class="cteach">${escapeHtml(cell.teacher||'')}</div>` : `<div class="cempty">&middot;</div>`}
      </div>`;
    });
  });
  grid += `</div>`;

  const switcher = canBrowse ? `
    <div class="sched-switcher">
      <select id="schedGradePick">${GRADES.map(g=>`<option value="${g}" ${String(g)===String(grade)?'selected':''}>Grade ${g}</option>`).join('')}</select>
      <select id="schedSectionPick">${SECTIONS.map(s=>`<option value="${s}" ${s===section?'selected':''}>Section ${s}</option>`).join('')}</select>
    </div>` : '';

  return `
    <div class="page-header">
      <div><h2>Weekly Schedule</h2><div class="sub">
        ${user.role==='student'? `Grade ${escapeHtml(String(grade))}, Section ${escapeHtml(section)}.`
          : canEdit? `Tap any lesson to edit it for Grade ${escapeHtml(String(grade))}, Section ${escapeHtml(section)}.`
          : `Viewing Grade ${escapeHtml(String(grade))}, Section ${escapeHtml(section)} &mdash; your principal or IT team manages this.`}
      </div></div>
      ${switcher}
    </div>
    <div class="panel"><div class="schedule-wrap">${grid}</div></div>`;
}
function bindSchedule(user){
  const gradePick = document.getElementById('schedGradePick');
  const sectionPick = document.getElementById('schedSectionPick');
  if(gradePick) gradePick.onchange = ()=>{ scheduleView.grade = parseInt(gradePick.value,10); renderPage(); };
  if(sectionPick) sectionPick.onchange = ()=>{ scheduleView.section = sectionPick.value; renderPage(); };
  if(!isStaff(user)) return;
  document.querySelectorAll('.sched-cell').forEach(el=>{
    el.onclick = ()=> openScheduleEditor(el.dataset.key);
  });
}
function openScheduleEditor(key){
  const [gradeStr, section, day, lessonStr] = key.split('_');
  const grade = parseInt(gradeStr,10);
  const lesson = parseInt(lessonStr,10);
  const existing = DB.schedule[key] || {subject:'', teacher:''};
  const teacherNames = DB.users.filter(u=>u.role==='teacher').map(u=>u.name);
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" style="width:min(380px,94vw);">
      <button class="modal-close" id="mClose">${icon('xmark')}</button>
      <h3>Grade ${grade} &middot; ${section} &middot; ${day} &middot; Lesson ${lesson}</h3>
      <div class="field"><label>Subject</label>
        <select id="schSubject"><option value="">&mdash; empty &mdash;</option>${SUBJECTS.map(s=>`<option value="${s}" ${existing.subject===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Teacher</label>
        <select id="schTeacher"><option value="">&mdash; none &mdash;</option>${teacherNames.map(n=>`<option value="${n}" ${existing.teacher===n?'selected':''}>${n}</option>`).join('')}</select>
      </div>
      <button class="btn btn-fill-red" id="schSave">Save</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('mClose').onclick = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('schSave').onclick = async ()=>{
    const subject = document.getElementById('schSubject').value;
    const teacher = document.getElementById('schTeacher').value;
    const btn = document.getElementById('schSave');
    btn.disabled = true;
    if(subject){
      /* One row per grade/section/day/period slot -- upsert on that combo. */
      const {error} = await sb.from('schedule')
        .upsert({grade, section, day, period:lesson, subject, teacher: teacher || null},
                {onConflict:'grade,section,day,period'});
      if(error){ btn.disabled=false; sbFail('saveSchedule', error); return; }
      DB.schedule[key] = {subject, teacher};
    } else {
      const {error} = await sb.from('schedule')
        .delete().eq('grade',grade).eq('section',section).eq('day',day).eq('period',lesson);
      if(error){ btn.disabled=false; sbFail('clearSchedule', error); return; }
      delete DB.schedule[key];
    }
    overlay.remove();
    renderPage();
  };
}

/* ---------- USERS (principal/IT) ---------- */
/* A small reusable confirm dialog for destructive/irreversible actions --
   used by account deletion and every action in the school-year wizard. */
function openConfirmModal(title, message, confirmLabel, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" style="width:min(420px,94vw);text-align:center;">
      <button class="modal-close" id="mClose">${icon('xmark')}</button>
      <h3>${title}</h3>
      <p style="color:var(--ink-soft);font-size:14px;line-height:1.6;margin:0 0 20px;">${message}</p>
      <div class="btn-row">
        <button class="btn btn-danger" id="confirmYes">${confirmLabel}</button>
        <button class="btn btn-ghost" id="confirmNo" style="width:100%;">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('mClose').onclick = ()=>overlay.remove();
  document.getElementById('confirmNo').onclick = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('confirmYes').onclick = ()=>{
    document.getElementById('confirmYes').disabled = true;
    onConfirm(overlay);
  };
}

function pageUsers(user){
  const rows = DB.users.map(u=>{
    const detail = u.role==='student' ? `Grade ${u.grade||'-'} / Sec ${u.section||'-'}` : (u.role==='teacher' ? (u.subject||'-') : '&mdash;');
    const isSelf = u.id===user.id;
    return `<div class="user-row ${u.banned?'banned':''}">
      <div><div class="uh-name">${escapeHtml(u.name)}</div><div class="uh-sub">${detail}</div></div>
      <div><span class="mlabel">Role: </span><span class="badge-role" style="text-transform:none;">${u.role==='it' ? 'IT' : (u.role.charAt(0).toUpperCase()+u.role.slice(1))}</span></div>
      <div><span class="mlabel">Password: </span><span style="font-size:13px;color:var(--ink-soft);" title="Passwords are hashed and cannot be displayed">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span></div>
      <div><span class="mlabel">Joined: </span><span style="font-size:12px;color:var(--ink-soft);">${new Date(u.joined).toLocaleDateString()}</span></div>
      <div><span class="mlabel">Status: </span><span style="font-size:12px;font-weight:700;color:${u.banned?'var(--red)':'#2f5b47'};">${u.banned?'Banned':'Active'}</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${isSelf? '' : `<button class="btn btn-sm ${u.banned?'btn-fill-yellow':'btn-danger'}" data-ban="${u.id}">${u.banned?'Unban':'Ban'}</button>`}
        ${isSelf? '' : `<button class="btn btn-sm btn-danger" data-deluser="${u.id}" title="Delete permanently">${icon('trash')}</button>`}
      </div>
    </div>`;
  }).join('');
  return `
    <div class="page-header">
      <div><h2>Users</h2><div class="sub">Everyone registered in RONA.</div></div>
      <button class="btn btn-fill-red btn-sm" id="btnUpgradeYear">${icon('layer-group')} Upgrade school year</button>
    </div>
    <div class="panel">
      <div class="users-head"><span>Name</span><span>Role</span><span>Password</span><span>Joined</span><span>Status</span><span></span></div>
      ${rows}
    </div>`;
}
function bindUsers(user){
  document.querySelectorAll('[data-ban]').forEach(el=>{
    el.onclick = async ()=>{
      const u = DB.users.find(x=>x.id===el.dataset.ban);
      if(!u) return;
      const next = !u.banned;
      const {error} = await sb.from('users')
        .update({status: next ? 'banned' : 'active'}).eq('id', u.id);
      if(error){ sbFail('banUser', error); return; }
      u.banned = next;
      toast(next? `${u.name} has been banned.` : `${u.name} has been unbanned.`);
      renderPage();
    };
  });
  document.querySelectorAll('[data-deluser]').forEach(el=>{
    el.onclick = ()=>{
      const u = DB.users.find(x=>x.id===el.dataset.deluser);
      if(!u) return;
      openConfirmModal(
        'Delete this account?',
        `${escapeHtml(u.name)}'s account will be permanently deleted &mdash; gone, not just banned. This can't be undone.`,
        'Delete permanently',
        async (overlay)=>{
          const {error} = await sb.from('users').delete().eq('id', u.id);
          if(error){ overlay.remove(); sbFail('deleteUser', error); return; }
          DB.users = DB.users.filter(x=>x.id!==u.id);
          overlay.remove();
          toast(`${u.name}'s account was deleted.`);
          renderPage();
        }
      );
    };
  });
  const upBtn = document.getElementById('btnUpgradeYear');
  if(upBtn) upBtn.onclick = ()=>{
    yearUpgradeIndex = 0;
    yearUpgradeSelected.clear();
    renderPage();
  };
}

/* ---------- UPGRADE SCHOOL YEAR (principal/IT) ---------- */
/* Walks through every class (Grade 1 Section A ... Grade 12 Section F) in
   order so a whole school can be rolled into the next year without anyone
   re-registering. Passed/Held back move students; Left the school deletes
   the account outright, matching the "delete users" ask above. */
const YEAR_UPGRADE_TOTAL = GRADES.length * SECTIONS.length;
function yearUpgradeClassAt(index){
  return { grade: GRADES[Math.floor(index / SECTIONS.length)], section: SECTIONS[index % SECTIONS.length] };
}
function pageYearUpgrade(user){
  const {grade, section} = yearUpgradeClassAt(yearUpgradeIndex);
  const students = DB.users
    .filter(u=>u.role==='student' && String(u.grade)===String(grade) && u.section===section)
    .sort((a,b)=>a.name.localeCompare(b.name));
  const rows = students.map(s=>`
    <button class="yu-row ${yearUpgradeSelected.has(s.id)?'selected':''}" data-student="${s.id}">
      <span class="yu-check">${yearUpgradeSelected.has(s.id)? icon('circle-check') : ''}</span>
      <span class="yu-name">${escapeHtml(s.name)}</span>
    </button>`).join('');

  return `
    <button class="back-link" id="yuExit">${icon('arrow-left')} Back to Users</button>
    <div class="panel">
      <div class="cal-nav">
        <button class="cal-arrow" id="yuPrev" title="Previous class" ${yearUpgradeIndex===0?'disabled':''}>${icon('chevron-left')}</button>
        <div class="cal-date-box">
          <div class="cdow">CLASS ${yearUpgradeIndex+1} OF ${YEAR_UPGRADE_TOTAL}</div>
          <div class="cdate">Grade ${grade} &middot; Section ${section}</div>
        </div>
        <button class="cal-arrow" id="yuNext" title="Next class" ${yearUpgradeIndex===YEAR_UPGRADE_TOTAL-1?'disabled':''}>${icon('chevron-right')}</button>
      </div>
    </div>
    <div class="panel">
      <h3>Students in this class ${students.length? `&middot; ${yearUpgradeSelected.size} selected`:''}</h3>
      ${students.length
        ? `<div class="yu-list">${rows}</div>
           <div class="yu-actions">
             <button class="btn btn-fill-red" id="yuPass" ${yearUpgradeSelected.size?'':'disabled'}>${icon('circle-check')} Passed</button>
             <button class="btn btn-outline-red" id="yuHeld" ${yearUpgradeSelected.size?'':'disabled'}>${icon('clock')} Held back</button>
             <button class="btn btn-danger" id="yuLeft" ${yearUpgradeSelected.size?'':'disabled'}>${icon('xmark')} Left the school</button>
           </div>`
        : emptyState('users','No students in this class.')}
    </div>
    <div class="panel" style="text-align:center;">
      <button class="btn btn-fill-yellow" id="yuContinue" style="max-width:300px;margin:0 auto;">Continue to next class ${icon('chevron-right')}</button>
    </div>`;
}
function bindYearUpgrade(user){
  const exitBtn = document.getElementById('yuExit');
  if(exitBtn) exitBtn.onclick = ()=>{ yearUpgradeIndex=null; yearUpgradeSelected.clear(); currentView='users'; renderPage(); };

  const prevBtn = document.getElementById('yuPrev');
  if(prevBtn) prevBtn.onclick = ()=>{ if(yearUpgradeIndex>0){ yearUpgradeIndex--; yearUpgradeSelected.clear(); renderPage(); } };

  const nextStep = ()=>{
    if(yearUpgradeIndex < YEAR_UPGRADE_TOTAL-1){ yearUpgradeIndex++; yearUpgradeSelected.clear(); renderPage(); }
    else { toast("That's the last class &mdash; you're all done!"); }
  };
  const nextBtn = document.getElementById('yuNext');
  if(nextBtn) nextBtn.onclick = nextStep;
  const contBtn = document.getElementById('yuContinue');
  if(contBtn) contBtn.onclick = nextStep;

  document.querySelectorAll('[data-student]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.student;
      if(yearUpgradeSelected.has(id)) yearUpgradeSelected.delete(id);
      else yearUpgradeSelected.add(id);
      renderPage();
    };
  });

  const passBtn = document.getElementById('yuPass');
  if(passBtn) passBtn.onclick = ()=> openYearActionModal('pass');
  const heldBtn = document.getElementById('yuHeld');
  if(heldBtn) heldBtn.onclick = ()=> openYearActionModal('held');
  const leftBtn = document.getElementById('yuLeft');
  if(leftBtn) leftBtn.onclick = ()=> openYearActionModal('left');
}
function openYearActionModal(kind){
  const students = [...yearUpgradeSelected].map(id=>DB.users.find(u=>u.id===id)).filter(Boolean);
  if(!students.length) return;
  const {grade, section} = yearUpgradeClassAt(yearUpgradeIndex);
  const namesList = escapeHtml(students.map(s=>s.name).join(', '));
  const n = students.length;

  if(kind==='left'){
    openConfirmModal(
      `${n} student${n!==1?'s':''} left the school?`,
      `${namesList} &mdash; ${n===1?'their':'their'} account${n!==1?'s':''} will be permanently deleted. This can't be undone.`,
      'Delete permanently',
      async (overlay)=>{
        const ids = students.map(s=>s.id);
        const {error} = await sb.from('users').delete().in('id', ids);
        if(error){ overlay.remove(); sbFail('yearUpgradeLeft', error); return; }
        DB.users = DB.users.filter(u=>!ids.includes(u.id));
        yearUpgradeSelected.clear();
        overlay.remove();
        toast(`${n} student${n!==1?'s':''} removed.`);
        renderPage();
      }
    );
    return;
  }

  const defaultGrade = kind==='pass' ? Math.min(12, grade+1) : grade;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" style="width:min(420px,94vw);">
      <button class="modal-close" id="mClose">${icon('xmark')}</button>
      <h3>${kind==='pass'?'Pass':'Hold back'} ${n} student${n!==1?'s':''}</h3>
      <p style="color:var(--ink-soft);font-size:13.5px;margin:-8px 0 16px;">${namesList}</p>
      <div class="field-row">
        <div class="field"><label>New grade</label><select id="yuGrade">${GRADES.map(g=>`<option value="${g}" ${g===defaultGrade?'selected':''}>Grade ${g}</option>`).join('')}</select></div>
        <div class="field"><label>New section</label><select id="yuSection">${SECTIONS.map(s=>`<option value="${s}" ${s===section?'selected':''}>${s}</option>`).join('')}</select></div>
      </div>
      <button class="btn btn-fill-red" id="yuConfirm">Confirm &amp; move ${n} student${n!==1?'s':''}</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('mClose').onclick = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('yuConfirm').onclick = async ()=>{
    const newGrade = parseInt(document.getElementById('yuGrade').value,10);
    const newSection = document.getElementById('yuSection').value;
    const btn = document.getElementById('yuConfirm');
    btn.disabled = true; btn.textContent = 'Saving...';
    const ids = students.map(s=>s.id);
    const {error} = await sb.from('users').update({grade:newGrade, section:newSection}).in('id', ids);
    if(error){
      btn.disabled=false; btn.textContent = `Confirm & move ${n} student${n!==1?'s':''}`;
      sbFail('yearUpgradeMove', error); return;
    }
    students.forEach(s=>{ s.grade=newGrade; s.section=newSection; });
    yearUpgradeSelected.clear();
    overlay.remove();
    toast(`Moved to Grade ${newGrade}, Section ${newSection}.`);
    renderPage();
  };
}

/* ---------- REPORT (student & teacher submit) ---------- */
function pageReport(user){
  const mine = DB.reports.filter(r=>r.userId===user.id).sort((a,b)=>b.createdAt-a.createdAt);
  return `
    <div class="page-header"><div><h2>Report an issue</h2><div class="sub">Tell your principal what went wrong &mdash; it lands straight in their inbox.</div></div></div>
    <div class="panel" style="max-width:560px;">
      <div class="field"><label>What happened?</label>
        <textarea id="reportText" rows="5" placeholder="Describe the issue..." style="width:100%;padding:12px 14px;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--paper);font-size:14px;resize:vertical;"></textarea>
      </div>
      <button class="btn btn-fill-red" id="reportSubmit">Submit report</button>
    </div>
    ${mine.length? `
    <div class="panel" style="max-width:560px;">
      <h3>Your past reports</h3>
      ${mine.map(r=>`
        <div class="list-row" style="align-items:flex-start;flex-direction:column;gap:8px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="tag ${r.status==='open'?'tag-Event':'tag-Announcement'}">${r.status==='open'?'Pending':'Reviewed'}</span>
            <span class="ctime" style="color:var(--ink-soft);font-size:11px;">${new Date(r.createdAt).toLocaleString()}</span>
          </div>
          <div style="font-size:13.5px;">${escapeHtml(r.text)}</div>
          ${r.replyText? `
            <div style="width:100%;background:var(--yellow-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;">
              <b style="color:var(--red);">${escapeHtml(r.repliedByName||'Principal')} replied:</b><br>${escapeHtml(r.replyText)}
            </div>`:''}
        </div>`).join('')}
    </div>`:''}`;
}
function bindReport(user){
  document.getElementById('reportSubmit').onclick = async ()=>{
    const box = document.getElementById('reportText');
    const btn = document.getElementById('reportSubmit');
    const val = box.value.trim();
    if(!val){ toast('Please describe the issue first.'); return; }
    btn.disabled = true; btn.textContent = 'Submitting...';
    const {data, error} = await sb.from('reports').insert({
      content: val, status: 'open', user_id: user.id,
      author_name: user.name, author_role: user.role
    }).select().single();
    btn.disabled = false; btn.textContent = 'Submit report';
    if(error){ sbFail('submitReport', error); return; }
    const r = mapReport(data);
    if(!DB.reports.some(x=>x.id===r.id)) DB.reports.push(r);
    toast('Report submitted. Thank you!');
    renderPage();
  };
}

/* ---------- REPORTS INBOX (principal/IT) ---------- */
function pageReportsInbox(user){
  const reports = DB.reports.filter(r=>r.status==='open').sort((a,b)=>b.createdAt-a.createdAt);
  return `
    <div class="page-header"><div><h2>Reports</h2><div class="sub">${reports.length} open report${reports.length!==1?'s':''} from students and teachers, newest first.</div></div></div>
    <div class="panel">
      ${reports.length? reports.map(r=>`
        <div class="list-row" style="align-items:flex-start;flex-direction:column;gap:10px;">
          <div style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:10px;">
            <div style="display:flex; align-items:center; gap:8px;">
              <b>${escapeHtml(r.by)}</b>
              <span class="badge-role" style="text-transform:none;">${r.role==='it' ? 'IT' : escapeHtml(r.role||'')}</span>
              <span class="ctime" style="color:var(--ink-soft);font-size:11px;">${new Date(r.createdAt).toLocaleString()}</span>
            </div>
            <button class="cdel" data-dismiss="${r.id}" title="Dismiss">${icon('xmark')}</button>
          </div>
          <div style="font-size:13.5px; line-height:1.5;">${escapeHtml(r.text)}</div>
          <div style="width:100%; display:flex; gap:8px;">
            <input type="text" data-replyinput="${r.id}" placeholder="Write a reply..." style="flex:1;padding:10px 14px;border-radius:var(--r-sm);border:2px solid var(--line);font-size:13.5px;">
            <button class="btn btn-fill-yellow btn-sm" data-sendreply="${r.id}">${icon('reply')} Reply</button>
          </div>
        </div>`).join('') : emptyState('flag','No open reports &mdash; all clear!')}
    </div>`;
}
function bindReportsInbox(user){
  document.querySelectorAll('[data-dismiss]').forEach(el=>{
    el.onclick = async ()=>{
      const rid = el.dataset.dismiss;
      /* Keep the row for the record; just take it out of the open inbox. */
      const {error} = await sb.from('reports')
        .update({status:'dismissed', resolved_at:new Date().toISOString()}).eq('id', rid);
      if(error){ sbFail('dismissReport', error); return; }
      const rr = DB.reports.find(x=>x.id===rid);
      if(rr) rr.status = 'dismissed';
      toast('Report dismissed.');
      renderShell();
    };
  });
  document.querySelectorAll('[data-sendreply]').forEach(el=>{
    el.onclick = async ()=>{
      const rid = el.dataset.sendreply;
      const input = document.querySelector(`[data-replyinput="${rid}"]`);
      const text = input.value.trim();
      if(!text) return;
      el.disabled = true;
      const {error} = await sb.from('reports')
        .update({reply_text:text, replied_by_name:user.name, replied_at:new Date().toISOString()}).eq('id', rid);
      el.disabled = false;
      if(error){ sbFail('replyReport', error); return; }
      const rr = DB.reports.find(x=>x.id===rid);
      if(rr){ rr.replyText=text; rr.repliedByName=user.name; rr.repliedAt=Date.now(); }
      toast('Reply sent.');
      renderPage();
    };
  });
}

/* ================= INIT ================= */
/* Everything now comes from Supabase, so the first paint waits on the
   initial load instead of reading synchronously from localStorage. */
async function bootstrap(){
  authStage.innerHTML = `
    <div class="fade-in loading-wrap">
      <div class="spinner"></div>
      <p>Connecting to RONA...</p>
    </div>`;

  const ok = await loadAll();
  if(!ok){
    authStage.innerHTML = `
      <div class="fade-in">
        <h1 style="font-size:20px;">Can't reach the server</h1>
        <div class="tagline">Check your connection, then try again.</div>
        <button class="btn btn-fill-red" id="retryBoot">Retry</button>
      </div>`;
    document.getElementById('retryBoot').onclick = bootstrap;
    return;
  }

  startRealtime();

  if(!getDeviceMode()){
    renderDevicePicker();
  } else if(session && currentUser()){
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    renderShell();
    applyResponsiveSidebarState();
    applyPersonalization(currentUser());
    maybeShowUpdateLog();
  } else {
    authRenderWelcome();
  }
}
bootstrap();
</script>
