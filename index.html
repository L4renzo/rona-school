<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RONA Homework System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#8A1F1F;
    --red-dark:#651414;
    --red-soft:#B24B4B;
    --yellow:#F0B815;
    --yellow-soft:#FBE7A6;
    --white:#FFFFFF;
    --paper:#FFFDF9;
    --ink:#3B1414;
    --ink-soft:#8a6a6a;
    --line: rgba(138,31,31,0.12);
    --r-xl: 32px;
    --r-lg: 24px;
    --r-md: 16px;
    --r-sm: 10px;
    --shadow: 0 20px 45px -20px rgba(101,20,20,0.35);
    --shadow-sm: 0 8px 20px -10px rgba(101,20,20,0.25);
  }
  *{box-sizing:border-box;}
  .icon{
    width:1em; height:1em; display:inline-block; vertical-align:-0.14em;
    fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
    flex-shrink:0;
  }
  .icon.filled{ fill:currentColor; stroke:none; }
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow-x:hidden;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
  }
  button{font-family:inherit;cursor:pointer;}
  select,input,textarea{font-family:inherit;}
  ::selection{background:var(--yellow-soft);}
  .hidden{display:none !important;}

  /* ---------------- AUTH SCREEN ---------------- */
  #authScreen{
    position:relative;
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:32px 16px;
    background:
      radial-gradient(circle at 15% 20%, rgba(240,184,21,0.10), transparent 55%),
      radial-gradient(circle at 85% 80%, rgba(138,31,31,0.08), transparent 55%),
      var(--paper);
  }
  .auth-top-brand{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:26px;
    opacity:0;
    animation:fadeSwap 0.8s ease forwards;
    animation-delay:0.05s;
  }
  .auth-top-brand img{
    width:104px;
    height:auto;
    filter:drop-shadow(0 10px 18px rgba(101,20,20,0.28));
    margin-bottom:14px;
  }
  .auth-top-brand .auth-motto{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:600;
    color:var(--red);
    letter-spacing:0.01em;
    max-width:320px;
  }
  .auth-top-brand .auth-motto .hl{
    color:var(--yellow);
    font-weight:800;
  }
  @media(max-width:480px){
    .auth-top-brand img{ width:82px; }
    .auth-top-brand .auth-motto{ font-size:15px; }
  }
  .orb{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    opacity:0;
    filter:blur(2px);
    animation-name:orbPulse;
    animation-iteration-count:infinite;
    animation-timing-function:ease-in-out;
  }
  @keyframes orbPulse{
    0%{opacity:0; transform:scale(0.85);}
    50%{opacity:var(--peak,0.28); transform:scale(1);}
    100%{opacity:0; transform:scale(0.85);}
  }
  @media (prefers-reduced-motion: reduce){
    .orb{animation:none; opacity:0.12;}
  }

  .auth-card{
    position:relative;
    z-index:2;
    width:min(420px, 90vw);
    background:var(--white);
    border-radius:var(--r-xl);
    box-shadow:var(--shadow);
    padding:44px 36px 36px;
    text-align:center;
    border:1px solid var(--line);
    transform:translateY(140%);
    opacity:0;
    animation:riseUp 0.95s cubic-bezier(.16,.85,.3,1) forwards;
    animation-delay:0.15s;
  }
  @keyframes riseUp{
    to{ transform:translateY(0); opacity:1; }
  }
  .brand-mark{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:6px;
  }
  .brand-mark i{color:var(--yellow); font-size:20px;}
  .auth-card h1{
    font-size:26px;
    font-weight:700;
    letter-spacing:0.06em;
    color:var(--red);
    margin:0 0 4px;
  }
  .auth-card .tagline{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:30px;
    letter-spacing:0.03em;
  }
  .auth-stage{ min-height:60px; }
  .fade-in{ animation:fadeSwap 0.4s ease both; }
  @keyframes fadeSwap{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .btn{
    border:none;
    border-radius:var(--r-md);
    padding:14px 20px;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.02em;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    width:100%;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn:active{ transform:translateY(0); }
  .btn-row{ display:flex; flex-direction:column; gap:12px; margin-top:8px;}
  .btn-outline-red{
    background:var(--white);
    color:var(--red);
    border:2px solid var(--red);
  }
  .btn-outline-red:hover{ box-shadow:var(--shadow-sm); }
  .btn-fill-red{
    background:var(--red);
    color:var(--white);
  }
  .btn-fill-red:hover{ box-shadow:0 12px 24px -10px rgba(138,31,31,0.5); background:var(--red-dark); }
  .btn-fill-yellow{
    background:var(--yellow);
    color:var(--red-dark);
  }
  .btn-fill-yellow:hover{ box-shadow:0 12px 24px -10px rgba(240,184,21,0.6); }
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    font-weight:600;
    font-size:13px;
    width:auto;
    padding:8px 10px;
  }
  .btn-ghost:hover{ color:var(--red); }
  .btn-sm{ width:auto; padding:9px 16px; font-size:13px; }
  .btn-danger{ background:#fff; color:var(--red); border:2px solid var(--red-soft); }
  .btn-danger:hover{ background:var(--red); color:#fff; }

  .role-grid{ display:flex; flex-direction:column; gap:12px; }
  .role-card{
    display:flex; align-items:center; gap:14px;
    border:2px solid var(--line);
    border-radius:var(--r-md);
    padding:14px 16px;
    background:var(--white);
    text-align:left;
    transition:all .15s ease;
  }
  .role-card:hover{ border-color:var(--yellow); background:var(--yellow-soft); transform:translateY(-2px); }
  .role-card i{ font-size:20px; color:var(--red); width:26px; text-align:center; }
  .role-card .rtitle{ font-weight:700; color:var(--ink); font-size:15px; }
  .role-card .rsub{ font-size:12px; color:var(--ink-soft); }

  .field{ text-align:left; margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--red); letter-spacing:0.03em; margin-bottom:6px; text-transform:uppercase; }
  .field input, .field select{
    width:100%;
    padding:12px 14px;
    border-radius:var(--r-sm);
    border:2px solid var(--line);
    background:var(--paper);
    font-size:14px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
    appearance:none;
    -webkit-appearance:none;
  }
  .field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%238A1F1F' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:34px;
  }
  .field input:focus, .field select:focus{ border-color:var(--red); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .form-error{ color:var(--red); font-size:12.5px; margin:-6px 0 14px; text-align:left; display:none; }
  .toggle-pair{ display:flex; gap:10px; }
  .toggle-opt{
    flex:1; padding:10px; border-radius:var(--r-sm); border:2px solid var(--line);
    background:var(--paper); font-weight:700; font-size:13px; color:var(--ink-soft); text-align:center;
    transition:all .15s ease;
  }
  .toggle-opt.active{ border-color:var(--red); background:var(--red); color:#fff; }

  .auth-hint{ margin-top:18px; font-size:11.5px; color:var(--ink-soft); }
  .auth-hint b{ color:var(--red); }

  /* ---------------- APP SHELL ---------------- */
  #appScreen{ display:flex; min-height:100vh; background:var(--paper); }
  .sidebar{
    width:230px;
    background:var(--red);
    color:#fff;
    display:flex;
    flex-direction:column;
    padding:22px 14px;
    transition:width .25s ease, padding .25s ease;
    flex-shrink:0;
    position:relative;
    z-index:10;
  }
  .sidebar.collapsed{ width:78px; padding:22px 10px; }
  .side-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:30px; padding:0 6px;}
  .side-brand{ display:flex; align-items:center; gap:10px; overflow:hidden; white-space:nowrap; }
  .side-brand-logo{ width:26px; height:auto; flex-shrink:0; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }
  .side-brand span{ font-family:'Fraunces',serif; font-weight:700; letter-spacing:0.04em; font-size:15px; }
  .sidebar.collapsed .side-brand span{ display:none; }
  .side-toggle{
    background:rgba(255,255,255,0.12); border:none; color:#fff; width:32px; height:32px;
    border-radius:var(--r-sm); flex-shrink:0; display:flex; align-items:center; justify-content:center;
    transition:background .15s ease;
  }
  .side-toggle:hover{ background:rgba(255,255,255,0.25); }
  .nav-group{ display:flex; flex-direction:column; gap:6px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:14px;
    padding:12px 12px;
    border-radius:var(--r-sm);
    color:rgba(255,255,255,0.85);
    background:transparent;
    border:none;
    text-align:left;
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item i{ width:20px; text-align:center; font-size:16px; flex-shrink:0; }
  .nav-item:hover{ background:rgba(255,255,255,0.12); color:#fff; }
  .nav-item.active{ background:var(--yellow); color:var(--red-dark); }
  .sidebar.collapsed .nav-item span{ display:none; }
  .sidebar.collapsed .nav-item{ justify-content:center; }
  .nav-divider{ height:1px; background:rgba(255,255,255,0.15); margin:12px 4px; }
  .side-user{
    display:flex; align-items:center; gap:10px; padding:12px; border-radius:var(--r-sm);
    background:rgba(255,255,255,0.08); margin-top:8px; overflow:hidden;
  }
  .side-user .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--yellow); color:var(--red-dark);
    display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0; font-size:14px;
  }
  .side-user .uinfo{ white-space:nowrap; overflow:hidden; flex:1; min-width:0; }
  .side-user .uname{ font-size:13px; font-weight:700; color:#fff; overflow:hidden; text-overflow:ellipsis; }
  .side-user .urole{ font-size:11px; color:var(--yellow-soft); text-transform:capitalize; }
  .coin-chip{
    display:flex; align-items:center; gap:4px; flex-shrink:0; background:var(--yellow); color:var(--red-dark);
    font-size:11.5px; font-weight:800; padding:4px 8px; border-radius:12px;
  }
  .coin-chip .icon{ font-size:12px; }
  .sidebar.collapsed .coin-chip{ display:none; }
  .side-device-link{
    background:none; border:none; color:rgba(255,255,255,0.55); font-size:11px; font-weight:600;
    text-align:left; padding:8px 6px 0; width:100%; text-decoration:underline; text-underline-offset:2px;
  }
  .side-device-link:hover{ color:#fff; }
  .sidebar.collapsed .side-device-link{ display:none; }
  .sidebar.collapsed .side-user .uinfo{ display:none; }

  .main-content{ flex:1; padding:32px 40px; overflow-y:auto; max-height:100vh; }
  .page-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:14px;}
  .page-header h2{ font-size:26px; color:var(--red); margin:0; }
  .page-header .sub{ font-size:13px; color:var(--ink-soft); margin-top:4px; }
  .fab-yellow{
    width:46px; height:46px; border-radius:16px; border:none; background:var(--yellow);
    color:var(--red-dark); font-size:20px; box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:center; transition:transform .15s ease;
  }
  .fab-yellow:hover{ transform:translateY(-2px) rotate(90deg); }

  /* Home stats */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:18px; margin-bottom:32px; }
  .stat-card{
    background:var(--white); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:22px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
  }
  .stat-card i{ font-size:22px; color:var(--yellow); background:var(--red); width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
  .stat-card .num{ font-family:'Fraunces',serif; font-size:34px; font-weight:800; color:var(--red); line-height:1; }
  .stat-card .lbl{ font-size:13px; color:var(--ink-soft); margin-top:6px; font-weight:600; }

  .panel{ background:var(--white); border:1px solid var(--line); border-radius:var(--r-lg); padding:24px; box-shadow:var(--shadow-sm); }
  .panel + .panel{ margin-top:20px; }
  .panel h3{ color:var(--red); font-size:17px; margin:0 0 14px; }
  .list-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 16px; border-radius:var(--r-md); background:var(--paper); border:1px solid var(--line);
    margin-bottom:10px;
  }
  .list-row:last-child{ margin-bottom:0; }
  .tag{ display:inline-block; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.02em; }
  .tag-Homework{ background:#EFE3D6; color:#6b4a1f; }
  .tag-Exam{ background:#F6DADA; color:var(--red); }
  .tag-Event{ background:#FBE7A6; color:#7a5a05; }
  .tag-Announcement{ background:#DDE9E3; color:#2f5b47; }

  /* Agenda */
  .day-tabs{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
  .day-tab{
    flex:1; min-width:140px;
    background:var(--white); border:2px solid var(--line); border-radius:var(--r-lg);
    padding:16px 18px; text-align:left; transition:all .15s ease;
  }
  .day-tab:hover{ border-color:var(--yellow); }
  .day-tab.active{ border-color:var(--red); background:var(--red); color:#fff; }
  .day-tab .dname{ font-weight:800; font-size:15px; }
  .day-tab .ddate{ font-size:11.5px; opacity:0.75; margin-bottom:10px; }
  .day-tab .dcount{ font-size:12px; font-weight:700; color:var(--yellow); }
  .day-tab.active .dcount{ color:var(--yellow); }
  .day-tab:not(.active) .dcount{ color:var(--red-soft); }

  .hw-item{
    display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:var(--r-md);
    background:var(--paper); border:1px solid var(--line); margin-bottom:12px; transition:all .15s ease; text-align:left; width:100%;
  }
  .hw-item:hover{ border-color:var(--yellow); box-shadow:var(--shadow-sm); transform:translateY(-1px); }
  .hw-icon{ width:42px; height:42px; border-radius:13px; background:var(--red); color:var(--yellow); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px;}
  .hw-main{ flex:1; }
  .hw-subject{ font-weight:700; font-size:14.5px; color:var(--ink); }
  .hw-meta{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .empty-state{ text-align:center; padding:40px 20px; color:var(--ink-soft); }
  .empty-state i{ font-size:32px; color:var(--yellow); margin-bottom:10px; display:block; }

  /* Schedule */
  .schedule-wrap{ overflow-x:auto; }
  .schedule-grid{ display:grid; grid-template-columns:70px repeat(5, minmax(140px,1fr)); gap:10px; min-width:760px; }
  .sched-switcher{ display:flex; gap:8px; flex-wrap:wrap; }
  .sched-switcher select{
    padding:10px 30px 10px 14px; border-radius:var(--r-sm); border:2px solid var(--line);
    background:var(--white); font-size:13px; font-weight:700; color:var(--red);
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%238A1F1F' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center;
  }
  .sched-switcher select:focus{ outline:none; border-color:var(--red); }
  .sched-head{ font-weight:800; color:var(--red); text-align:center; padding:10px; font-size:13px; }
  .sched-lesson-lbl{ display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--ink-soft); font-size:12px; }
  .sched-cell{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 10px;
    min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    transition:all .15s ease;
  }
  .sched-cell.editable{ cursor:pointer; }
  .sched-cell.editable:hover{ border-color:var(--yellow); background:var(--yellow-soft); }
  .sched-cell .csub{ font-weight:700; font-size:13px; color:var(--red); }
  .sched-cell .cteach{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .sched-cell .cempty{ color:#c9b9b9; font-size:18px; }

  /* Users table */
  .user-row{
    display:grid; grid-template-columns: 1.4fr 1fr 1fr 1.2fr 1fr auto; gap:10px; align-items:center;
    padding:14px 16px; border-radius:var(--r-md); background:var(--paper); border:1px solid var(--line); margin-bottom:10px;
  }
  .user-row.banned{ opacity:0.55; }
  .user-row .uh-name{ font-weight:700; }
  .user-row .uh-sub{ font-size:11.5px; color:var(--ink-soft); }
  .badge-role{ text-transform:capitalize; font-weight:700; font-size:12px; color:var(--red); }
  .mlabel{ display:none; font-size:10px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em; }
  .users-head{ display:grid; grid-template-columns: 1.4fr 1fr 1fr 1.2fr 1fr auto; gap:10px; padding:0 16px 8px; font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(59,20,20,0.45); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:#fff; border-radius:var(--r-xl); padding:30px; width:min(480px,94vw);
    max-height:88vh; overflow-y:auto; box-shadow:var(--shadow); position:relative;
    animation:fadeSwap .25s ease both;
  }
  .modal-box h3{ color:var(--red); margin:0 0 20px; font-size:20px; }
  .modal-close{ position:absolute; top:18px; right:18px; background:var(--paper); border:none; width:32px; height:32px; border-radius:10px; color:var(--red); font-size:15px; }
  .modal-close:hover{ background:var(--yellow-soft); }
  .loading-wrap{ text-align:center; padding:30px 10px; }
  .spinner{
    width:44px; height:44px; border-radius:50%; border:4px solid var(--yellow-soft); border-top-color:var(--red);
    animation:spin 0.8s linear infinite; margin:0 auto 16px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-wrap p{ color:var(--red); font-weight:700; }

  /* Homework detail */
  .back-link{ display:inline-flex; align-items:center; gap:8px; color:var(--red); font-weight:700; font-size:13.5px; background:none; border:none; margin-bottom:18px; }
  .back-link:hover{ text-decoration:underline; }
  .hw-detail-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:8px;}
  .comment{
    display:flex; gap:12px; padding:14px 16px; border-radius:var(--r-md); background:var(--paper); border:1px solid var(--line); margin-bottom:10px;
  }
  .comment .cavatar{ width:32px; height:32px; border-radius:50%; background:var(--red); color:var(--yellow); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0; }
  .comment .cbody{ flex:1; }
  .comment .cname{ font-weight:700; font-size:13px; color:var(--ink); }
  .comment .ctext{ font-size:13.5px; margin-top:3px; color:var(--ink); }
  .comment .ctime{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; }
  .comment .cdel{ background:none; border:none; color:var(--ink-soft); font-size:13px; }
  .comment .cdel:hover{ color:var(--red); }
  .comment-media, .chat-media{

  /* ---------------- RESPONSIVE / MOBILE ---------------- */
  /* Layout below is driven by body.ui-compact / body.ui-phone, which JS sets
     from the device choice made on first visit (see the device picker).
     This is deliberately not left to @media alone: some in-app / embedded
     browsers misreport their viewport size, which is what caused the
     sidebar to stay in "desktop" layout on real phones before. A real
     narrow window still gets caught by the fallback @media rules below too. */
  .sidebar-backdrop{ display:none; }
  .mobile-menu-btn{ display:none; }

  body.ui-compact .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:250px; padding:22px 16px;
    transform:translateX(-100%);
    transition:transform .25s ease;
    box-shadow:0 0 40px rgba(0,0,0,0.35);
    z-index:60;
  }
  body.ui-compact .sidebar:not(.collapsed){ transform:translateX(0); }
  body.ui-compact .sidebar.collapsed{ width:250px; }
  body.ui-compact .sidebar .side-toggle{ display:none; }

  body.ui-compact .sidebar-backdrop{
    display:block; position:fixed; inset:0; background:rgba(30,10,10,0.45);
    z-index:55; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  body.ui-compact .sidebar-backdrop.show{ opacity:1; pointer-events:auto; }

  body.ui-compact .mobile-menu-btn{
    display:flex; align-items:center; justify-content:center;
    position:fixed; top:16px; left:16px; width:44px; height:44px;
    background:var(--red); color:var(--yellow); border:none; border-radius:14px;
    box-shadow:var(--shadow); z-index:45; font-size:18px;
  }

  body.ui-compact .main-content{ margin-left:0; padding:76px 16px 32px; max-height:none; }
  body.ui-compact .page-header{ gap:10px; }
  body.ui-compact .page-header h2{ font-size:21px; }
  body.ui-compact .stat-grid{ grid-template-columns:1fr 1fr; gap:12px; }
  body.ui-compact .field-row{ flex-direction:column; gap:0; }

  /* Users list becomes a stacked card per person instead of a cramped grid */
  body.ui-compact .users-head{ display:none; }
  body.ui-compact .user-row{ grid-template-columns:1fr; gap:8px; align-items:start; }
  body.ui-compact .user-row > div, body.ui-compact .user-row > button{ width:100%; }
  body.ui-compact .user-row .mlabel{ display:inline-block; }

  body.ui-phone .stat-grid{ grid-template-columns:1fr; }
  body.ui-phone .day-tab{ min-width:120px; }
  body.ui-phone .modal-box{ padding:22px; }

  /* iOS Safari zooms the page in if a focused input's font is under 16px --
     keep all form fields at 16px+ on touch-sized screens so typing doesn't
     yank the layout around. */
  body.ui-compact input, body.ui-compact select, body.ui-compact textarea{ font-size:16px !important; }

  /* Fallback for anyone who picked "Desktop" but is genuinely on a narrow
     window (e.g. resized browser) -- same behavior, just triggered by
     actual measured width rather than the stored choice. */
  @media(max-width:820px){
    body:not(.ui-compact) .sidebar{
      position:fixed; left:0; top:0; bottom:0; width:250px; padding:22px 16px;
      transform:translateX(-100%); transition:transform .25s ease;
      box-shadow:0 0 40px rgba(0,0,0,0.35); z-index:60;
    }
    body:not(.ui-compact) .sidebar:not(.collapsed){ transform:translateX(0); }
    body:not(.ui-compact) .sidebar .side-toggle{ display:none; }
    body:not(.ui-compact) .sidebar-backdrop{
      display:block; position:fixed; inset:0; background:rgba(30,10,10,0.45);
      z-index:55; opacity:0; pointer-events:none; transition:opacity .2s ease;
    }
    body:not(.ui-compact) .sidebar-backdrop.show{ opacity:1; pointer-events:auto; }
    body:not(.ui-compact) .mobile-menu-btn{
      display:flex; align-items:center; justify-content:center;
      position:fixed; top:16px; left:16px; width:44px; height:44px;
      background:var(--red); color:var(--yellow); border:none; border-radius:14px;
      box-shadow:var(--shadow); z-index:45; font-size:18px;
    }
    body:not(.ui-compact) .main-content{ margin-left:0; padding:76px 16px 32px; max-height:none; }
    body:not(.ui-compact) input, body:not(.ui-compact) select, body:not(.ui-compact) textarea{ font-size:16px !important; }
  }

  /* Smoother momentum scrolling on iOS for scrollable panels */
  .main-content, .modal-box, .update-list{ -webkit-overflow-scrolling:touch; }
</style>

/* Passwords are hashed in the browser before being sent, so the plaintext
   never leaves the device and never lands in the table. This is a big step
   up from what was here before, but it is still NOT real authentication --
   the hash effectively becomes the password. Move to Supabase Auth when you
   can (see notes at the end of the schema file). */
async function hashPassword(name, password){
  const data = new TextEncoder().encode(name.trim().toLowerCase() + ':' + password);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return 'sha256$' + [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

function mapQuiz(r){
  const questions = (r.quiz_questions||[])
    .slice().sort((a,b)=>a.position-b.position)
    .map(q=>{
      const base = { id:q.id, text:q.text, type:q.type };
      if(q.type==='mcq'){
        const opts = (q.quiz_options||[]).slice().sort((a,b)=>a.position-b.position);
        base.options = opts.map(o=>({ id:o.id, text:o.text }));
        const correct = opts.find(o=>o.is_correct);
        base.correctOptionId = correct ? correct.id : null;
      } else if(q.type==='truefalse'){
        base.tfCorrect = q.tf_correct;
      } else {
        base.shortCorrect = q.short_correct;
      }
      return base;
    });
  return { id:r.id, title:r.title, subject:r.subject, grade:r.grade, section:r.section,
           questions, createdBy:r.created_by, createdByName:r.created_by_name,
           createdByRole:r.created_by_role, createdAt:tsToMs(r.created_at) };
}
function mapAttempt(r){
  const answers = (r.quiz_answers||[]).map(a=>({
    questionId: a.question_id,
    given: a.selected_option_id != null ? a.selected_option_id
         : (a.given_bool != null ? String(a.given_bool) : (a.given_text || ''))
  }));
  return { id:r.id, quizId:r.quiz_id, studentId:r.student_id, studentName:r.student_name,
           answers, score:r.score, total:r.total, submittedAt:tsToMs(r.submitted_at) };
}

async function loadAll(){

         proofThreads, proofMessages, chatMessages, journalEntries, shopPurchases] = await Promise.all([
    sb.from('users').select('*'),
    sb.from('homework').select('*'),
    sb.from('homework_comments').select('*'),
    sb.from('schedule').select('*'),
    sb.from('posts').select('*'),

    sb.from('reports').select('*'),
    sb.from('homework_proof_threads').select('*'),

    sb.from('class_chat_messages').select('*'),
    sb.from('journal_entries').select('*'),
    sb.from('shop_purchases').select('*')
  ]);
  const all = [users,homework,comments,schedule,posts,quizzes,attempts,reports,
               proofThreads,proofMessages,chatMessages,journalEntries,shopPurchases];
  const first = all.find(r=>r && r.error);
  if(first){ sbFail('loadAll', first.error); return false; }

  DB.users        = (users.data||[]).map(mapUser);
  DB.homeworks    = (homework.data||[]).map(mapHomework);
  DB.comments     = (comments.data||[]).map(mapComment);
  DB.posts        = (posts.data||[]).map(mapPost);
  DB.quizzes      = (quizzes.data||[]).map(mapQuiz);
  DB.quizAttempts = (attempts.data||[]).map(mapAttempt);

  DB.journalEntries = (journalEntries.data||[]).map(mapJournalEntry);
  DB.shopPurchases  = (shopPurchases.data||[]).map(mapShopPurchase);
  DB.schedule     = {};
  (schedule.data||[]).forEach(r=>{
    DB.schedule[r.grade + '_' + r.section + '_' + r.day + '_' + r.period] = { subject:r.subject, teacher:r.teacher || '' };
  });
  return true;
}

/* ---- Realtime: push new homework / reports / posts to every open client ---- */
function startRealtime(){
  sb.channel('rona-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'homework'}, payload=>{
      if(payload.eventType==='INSERT'){
        const hw = mapHomework(payload.new);
        if(!DB.homeworks.some(h=>h.id===hw.id)){
          DB.homeworks.push(hw);
          const me = currentUser();
          /* Only announce it if this class would actually see it. */
          if(me && visibleHomeworks(me).some(h=>h.id===hw.id) && hw.createdBy!==me.id){
            toast(`New ${hw.type.toLowerCase()}: ${hw.subject}`);
          }
        }
      } else if(payload.eventType==='UPDATE'){
        const hw = mapHomework(payload.new);
        const i = DB.homeworks.findIndex(h=>h.id===hw.id);
        if(i>-1) DB.homeworks[i] = hw;
      } else if(payload.eventType==='DELETE'){
        DB.homeworks = DB.homeworks.filter(h=>h.id!==payload.old.id);
        DB.comments  = DB.comments.filter(c=>c.homeworkId!==payload.old.id);
        if(viewingHomeworkId===payload.old.id) viewingHomeworkId = null;
      }
      refreshIfViewing(['home','agenda','calendar']);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'posts'}, payload=>{
      if(payload.eventType==='INSERT'){
        const p = mapPost(payload.new);
        if(!DB.posts.some(x=>x.id===p.id)){
          DB.posts.push(p);
          const me = currentUser();
          if(me && p.createdBy!==me.id) toast('New post: ' + p.title);
        }
      } else if(payload.eventType==='UPDATE'){
        const p = mapPost(payload.new);
        const i = DB.posts.findIndex(x=>x.id===p.id);
        if(i>-1) DB.posts[i] = p;
      } else if(payload.eventType==='DELETE'){
        DB.posts = DB.posts.filter(x=>x.id!==payload.old.id);
      }
      refreshIfViewing(['posts','home']);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'reports'}, payload=>{
      if(payload.eventType==='INSERT'){
        const r = mapReport(payload.new);
        if(r.status==='open' && !DB.reports.some(x=>x.id===r.id)){
          DB.reports.push(r);
          const me = currentUser();
          if(me && isStaff(me)) toast('New report from ' + (r.by||'someone'));
        }
      } else if(payload.eventType==='UPDATE'){
        const r = mapReport(payload.new);
        DB.reports = DB.reports.filter(x=>x.id!==r.id);
        if(r.status==='open') DB.reports.push(r);
      } else if(payload.eventType==='DELETE'){
        DB.reports = DB.reports.filter(x=>x.id!==payload.old.id);
      }
      if(currentUser()) renderShell();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'homework_comments'}, payload=>{
      if(payload.eventType==='INSERT'){
        const c = mapComment(payload.new);
        if(!DB.comments.some(x=>x.id===c.id)) DB.comments.push(c);
      } else if(payload.eventType==='DELETE'){
        DB.comments = DB.comments.filter(x=>x.id!==payload.old.id);
      }
      if(viewingHomeworkId) renderPage();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'schedule'}, async ()=>{
      const {data, error} = await sb.from('schedule').select('*');
      if(error) return;
      DB.schedule = {};
      (data||[]).forEach(r=>{ DB.schedule[r.grade+'_'+r.section+'_'+r.day+'_'+r.period] = {subject:r.subject, teacher:r.teacher||''}; });
      refreshIfViewing(['schedule']);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'users'}, payload=>{
      if(payload.eventType==='INSERT'){
        const u = mapUser(payload.new);
        if(!DB.users.some(x=>x.id===u.id)) DB.users.push(u);
        refreshIfViewing(['users']);
        return;
      }
      if(payload.eventType==='DELETE'){
        DB.users = DB.users.filter(x=>x.id!==payload.old.id);
        const me = currentUser();
        if(me && me.id===payload.old.id){
          toast('Your account no longer exists.');
          logout();
          return;
        }
        refreshIfViewing(['users']);
        return;
      }
      // UPDATE
      const u = mapUser(payload.new);
      const i = DB.users.findIndex(x=>x.id===u.id);
      if(i>-1) DB.users[i] = u;
      const me = currentUser();
      if(me && me.id===u.id){
        if(u.banned){ toast('Your account has been banned.'); logout(); return; }
        Object.assign(me, u);           // keep the live session object in sync too
        applyPersonalization(me);        // theme/font/colors may have changed from another tab
        renderSidebarUserCard();         // coin balance, avatar -- always safe to refresh
        refreshIfViewing(['shop','users']);
      } else {
        refreshIfViewing(['users']);
      }
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'quizzes'}, async payload=>{
      if(DB.quizzes.some(q=>q.id===payload.new.id)) return;
      const {data} = await sb.from('quizzes').select('*, quiz_questions(*, quiz_options(*))').eq('id', payload.new.id).single();
      if(data){
        DB.quizzes.push(mapQuiz(data));
        const me = currentUser();
        if(me && me.role==='student' && String(data.grade)===String(me.grade) && data.section===me.section){
          toast('New quiz: ' + data.title);
        }
        refreshIfViewing(['quizzes']);
      }
    })
    .on('postgres_changes', {event:'DELETE', schema:'public', table:'quizzes'}, payload=>{
      DB.quizzes = DB.quizzes.filter(q=>q.id!==payload.old.id);
      DB.quizAttempts = DB.quizAttempts.filter(a=>a.quizId!==payload.old.id);
      if(viewingQuizId===payload.old.id){ viewingQuizId=null; quizMode=null; }
      refreshIfViewing(['quizzes']);
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'quiz_attempts'}, async payload=>{
      if(DB.quizAttempts.some(a=>a.id===payload.new.id)) return;
      const {data} = await sb.from('quiz_attempts').select('*, quiz_answers(*)').eq('id', payload.new.id).single();
      if(data){
        DB.quizAttempts.push(mapAttempt(data));
        refreshIfViewing(['quizzes']);
      }
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'class_chat_messages'}, payload=>{
      if(payload.eventType==='INSERT'){
        const m = mapChatMessage(payload.new);
        if(!DB.chatMessages.some(x=>x.id===m.id)) DB.chatMessages.push(m);
      } else if(payload.eventType==='UPDATE'){
        const m = mapChatMessage(payload.new);
        const i = DB.chatMessages.findIndex(x=>x.id===m.id);
        if(i>-1) DB.chatMessages[i] = m;
      } else if(payload.eventType==='DELETE'){
        DB.chatMessages = DB.chatMessages.filter(x=>x.id!==payload.old.id);
      }
      refreshIfViewing(['classchat']);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'homework_proof_threads'}, payload=>{
      if(payload.eventType==='INSERT'){
        if(!DB.proofThreads.some(t=>t.id===payload.new.id)) DB.proofThreads.push(mapProofThread(payload.new));
      } else if(payload.eventType==='UPDATE'){
        const t = DB.proofThreads.find(x=>x.id===payload.new.id);
        if(t) t.lastMessageAt = tsToMs(payload.new.last_message_at);
      }
      refreshIfViewing(['proof']);
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'homework_proof_messages'}, payload=>{
      const m = mapProofMessage(payload.new);
      if(DB.proofMessages.some(x=>x.id===m.id)) return;
      DB.proofMessages.push(m);
      const me = currentUser();
      if(me && m.senderId!==me.id){
        if(m.coinsAwarded) toast(`You were awarded ${m.coinsAwarded} RonaCoins!`);
        else refreshIfViewing(['proof']);
      }
      refreshProofThreadIfOpen(m.threadId);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'journal_entries'}, payload=>{
      const me = currentUser();
      if(!me) return;
      if(payload.eventType==='INSERT'){
        if(payload.new.user_id!==me.id) return; // never surface someone else's private journal
        const e = mapJournalEntry(payload.new);
        if(!DB.journalEntries.some(x=>x.id===e.id)) DB.journalEntries.push(e);
      } else if(payload.eventType==='DELETE'){
        DB.journalEntries = DB.journalEntries.filter(x=>x.id!==payload.old.id);
      }
      refreshIfViewing(['journal']);
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'shop_purchases'}, payload=>{
      if(DB.shopPurchases.some(p=>p.id===payload.new.id)) return;
      DB.shopPurchases.push(mapShopPurchase(payload.new));
      refreshIfViewing(['shop']);
    })
    .subscribe();
}

/* Re-render only when the person is actually looking at an affected screen,
   so a background update never yanks them out of a form or a quiz. */
function refreshIfViewing(views){
  if(!currentUser()) return;
  if(document.querySelector('.modal-overlay')) return;
  if(viewingQuizId) return;
  if(views.includes(currentView) || viewingHomeworkId) renderPage();
}
/* Same idea, but specifically for the proof-thread detail view, since it
   bypasses currentView entirely (see renderPage's routing checks). */
function refreshProofThreadIfOpen(threadId){
  if(!currentUser()) return;
  if(document.querySelector('.modal-overlay')) return;
  if(viewingProofThreadId===threadId) renderPage();
}

function currentUser(){ return DB.users.find(u=>u.id===session?.userId); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ================= ORB BACKGROUND ================= */
function buildOrbs(){
  const layer = document.getElementById('orbLayer');
  layer.innerHTML = '';
  const palette = ['rgba(138,31,31,0.5)','rgba(240,184,21,0.55)'];
  const count = window.innerWidth < 640 ? 6 : 10;
  for(let i=0;i<count;i++){
    const o = document.createElement('div');
    o.className='orb';
    const size = 140 + Math.random()*260;
    o.style.width = size+'px';
    o.style.height = size+'px';
    o.style.left = (Math.random()*100)+'vw';
    o.style.top = (Math.random()*100)+'vh';
    o.style.background = `radial-gradient(circle, ${palette[i%2]}, transparent 70%)`;
    o.style.setProperty('--peak', (0.18+Math.random()*0.2).toFixed(2));
    o.style.animationDuration = (9+Math.random()*9).toFixed(1)+'s';
    o.style.animationDelay = (Math.random()*6).toFixed(1)+'s';
    layer.appendChild(o);
  }
}

/* ---------------- DEVICE MODE ---------------- */
const DEVICE_KEY = 'rona_device_mode';
function getDeviceMode(){ return localStorage.getItem(DEVICE_KEY); }
function applyDeviceMode(mode){
  document.body.classList.remove('ui-compact','ui-phone');
  if(mode==='mobile' || mode==='other') document.body.classList.add('ui-compact','ui-phone');
  else if(mode==='tablet') document.body.classList.add('ui-compact');
  // 'desktop' gets neither class -- full sidebar, normal layout
}
function setDeviceMode(mode){
  localStorage.setItem(DEVICE_KEY, mode);
  applyDeviceMode(mode);
  /* Remember it on the account too, when someone is signed in. */
  const u = currentUser();
  if(u){
    u.deviceMode = mode;
    sb.from('users').update({device_mode: mode}).eq('id', u.id)
      .then(({error})=>{ if(error) console.error('[Supabase] saveDeviceMode', error); });
  }
}

/* ---------------- MOBILE DRAWER ---------------- */
/* The device the person picked on first visit is the primary signal (see
   the device picker) -- some embedded/in-app browsers misreport their real
   viewport size, so we don't want to trust matchMedia alone. A genuinely
   narrow window is still caught as a bonus via matchMedia. */
function isMobileViewport(){
  if(document.body.classList.contains('ui-compact')) return true;
  if(window.matchMedia) return window.matchMedia('(max-width:820px)').matches;
  return window.innerWidth <= 820;
}
function openSidebar(){
  document.getElementById('sidebar').classList.remove('collapsed');
  if(isMobileViewport()){
    document.getElementById('sidebarBackdrop').classList.add('show');
    document.body.style.overflow = 'hidden';
  }
}
function closeSidebar(){
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('sidebarBackdrop').classList.remove('show');
  document.body.style.overflow = '';
}
function toggleSidebar(){
  const sidebar = document.getElementById('sidebar');
  if(sidebar.classList.contains('collapsed')) openSidebar();
  else closeSidebar();
}
document.getElementById('sideToggle').onclick = toggleSidebar;
document.getElementById('mobileMenuBtn').onclick = toggleSidebar;
document.getElementById('sidebarBackdrop').onclick = closeSidebar;

/* Sidebar starts closed on phones/tablets (off-canvas drawer) and open on
   desktop (full sidebar). Re-checked on resize/rotate so switching between
   a phone and a laptop mid-session always looks right. */
function applyResponsiveSidebarState(){
  const sidebar = document.getElementById('sidebar');
  if(!sidebar) return;
  if(isMobileViewport()){
    sidebar.classList.add('collapsed');
    document.getElementById('sidebarBackdrop').classList.remove('show');
    document.body.style.overflow = '';
  } else {
    sidebar.classList.remove('collapsed');
    document.getElementById('sidebarBackdrop').classList.remove('show');
    document.body.style.overflow = '';
  }
}
let _resizeT;
window.addEventListener('resize', ()=>{
  clearTimeout(_resizeT);
  _resizeT = setTimeout(applyResponsiveSidebarState, 150);
});

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderPage(){
  const user = currentUser();
  const main = document.getElementById('mainContent');
  if(viewingHomeworkId){ main.innerHTML = pageHomeworkDetail(user, viewingHomeworkId); bindHomeworkDetail(user); return; }
  if(viewingQuizId){ main.innerHTML = pageQuizDetail(user, viewingQuizId); bindQuizDetail(user); return; }
  if(yearUpgradeIndex!==null){ main.innerHTML = pageYearUpgrade(user); bindYearUpgrade(user); return; }
  if(viewingProofThreadId){ main.innerHTML = pageProofThread(user, viewingProofThreadId); bindProofThread(user); return; }
  switch(currentView){
    case 'home': main.innerHTML = pageHome(user); bindHome(user); break;
    case 'agenda': main.innerHTML = pageAgenda(user); bindAgenda(user); break;
    case 'calendar': main.innerHTML = pageCalendar(user); bindCalendar(user); break;
    case 'classchat': main.innerHTML = pageClassChat(user); bindClassChat(user); break;
    case 'proof': main.innerHTML = pageProofStation(user); bindProofStation(user); break;
    case 'journal': main.innerHTML = pageJournal(user); bindJournal(user); break;
    case 'quizzes': main.innerHTML = pageQuizzes(user); bindQuizzes(user); break;
    case 'posts': main.innerHTML = pagePosts(user); bindPosts(user); break;
    case 'schedule': main.innerHTML = pageSchedule(user); bindSchedule(user); break;
    case 'shop': main.innerHTML = pageShop(user); bindShop(user); break;
    case 'users': main.innerHTML = pageUsers(user); bindUsers(user); break;
    case 'report':
      if(isStaff(user)){ main.innerHTML = pageReportsInbox(user); bindReportsInbox(user); }
      else { main.innerHTML = pageReport(user); bindReport(user); }
      break;
    default: main.innerHTML = pageHome(user);
  }
}

/* ---------- HOME ---------- */
function tomorrowDayName(){
  const d = new Date(); d.setDate(d.getDate()+1);
  const names = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  return names[d.getDay()];
}
/* Students only ever see homework posted for their own grade + section.
   Teachers/principal see everything, since they manage the whole school.
   Items with no grade/section saved (old data) stay visible to everyone. */
function visibleHomeworks(user){
  if(user.role!=='student') return DB.homeworks;
  return DB.homeworks.filter(h=> !h.grade || !h.section || (String(h.grade)===String(user.grade) && h.section===user.section));
}
function visibleQuizzes(user){
  if(user.role!=='student') return DB.quizzes;
  return DB.quizzes.filter(q=> !q.grade || !q.section || (String(q.grade)===String(user.grade) && q.section===user.section));
}
function pageHome(user){
  const tmr = tomorrowDayName();
  const visible = visibleHomeworks(user);
  const tmrHw = visible.filter(h=>h.day===tmr);
  const count = t => tmrHw.filter(h=>h.type===t).length;
  const recent = [...visible].sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);
  return `
    <div class="page-header">
      <div>
        <h2>Welcome back, ${escapeHtml(user.name)}</h2>
        <div class="sub">Here's what's ahead for ${DAYS.includes(tmr)?('tomorrow, '+tmr):'the coming days'}${user.role==='student'?` &middot; Grade ${escapeHtml(String(user.grade))} Section ${escapeHtml(user.section)}`:''}.</div>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-card">${icon('book')}<div class="num">${count('Homework')}</div><div class="lbl">Homework due tomorrow</div></div>
      <div class="stat-card">${icon('file-pen')}<div class="num">${count('Exam')}</div><div class="lbl">Exams tomorrow</div></div>
      <div class="stat-card">${icon('calendar-star')}<div class="num">${count('Event')}</div><div class="lbl">Events tomorrow</div></div>
      <div class="stat-card">${icon('layer-group')}<div class="num">${visible.length}</div><div class="lbl">Total items posted</div></div>
    </div>
    <div class="panel">
      <h3>Recently posted</h3>
      ${recent.length? recent.map(h=>rowHwRecent(h)).join('') : emptyState('inbox','Nothing posted yet.')}
    </div>`;
}
function rowHwRecent(h){
  return `<div class="list-row" data-open="${h.id}" style="cursor:pointer;">
    <div>
      <span class="tag tag-${h.type}">${h.type}</span>
      <b style="margin-left:8px;">${escapeHtml(h.subject)}</b>
      ${h.grade? `<span class="sub" style="font-size:11px;margin-left:8px;color:var(--ink-soft);">Grade ${escapeHtml(String(h.grade))}${h.section?(' &middot; '+escapeHtml(h.section)):''}</span>`:''}
      ${h.createdByRole==='it' ? ` <span class="tag" style="background:var(--red);color:#fff;">IT</span>` : ''}
    </div>
    <div class="sub" style="font-size:12px;color:var(--ink-soft);">${h.day}</div>
  </div>`;
}
function emptyState(iconName,msg){ return `<div class="empty-state">${icon(iconName)}${msg}</div>`; }
function bindHome(user){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{ viewingHomeworkId = el.dataset.open; hwThreadStudentId=null; renderPage(); };
  });
}

/* ---------- AGENDA ---------- */
function nextDateForDay(dayName){
  const names = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const target = names.indexOf(dayName);
  const d = new Date();
  const diff = (target - d.getDay() + 7) % 7;
  d.setDate(d.getDate()+diff);
  return d;
}
function pageAgenda(user){
  const canPost = user.role==='teacher' || isStaff(user);
  const visible = visibleHomeworks(user);
  const tabs = DAYS.map(day=>{
    const cnt = visible.filter(h=>h.day===day).length;
    return `<button class="day-tab ${agendaSelectedDay===day?'active':''}" data-day="${day}">
      <div class="dname">${day}</div>
      <div class="ddate">${fmtDate(nextDateForDay(day))}</div>
      <div class="dcount">HOMEWORKS ADDED: ${cnt}</div>
    </button>`;
  }).join('');
  const items = visible.filter(h=>h.day===agendaSelectedDay).sort((a,b)=>b.createdAt-a.createdAt);
  return `
    <div class="page-header">
      <div><h2>Agenda</h2><div class="sub">${user.role==='student'? `Showing Grade ${escapeHtml(String(user.grade))}, Section ${escapeHtml(user.section)} only.` : 'Everything posted, organised by day.'}</div></div>
      ${canPost? `<button class="fab-yellow" id="btnAddHw" title="Add homework">${icon('plus')}</button>`:''}
    </div>
    <div class="day-tabs">${tabs}</div>
    <div class="panel">
      <h3>${agendaSelectedDay}</h3>
      <div id="hwList">
        ${items.length? items.map(h=>hwItemRow(h)).join('') : emptyState('calendar-xmark','No homework posted for this day yet.')}
      </div>
    </div>`;
}
function hwItemRow(h){
  const comments = DB.comments.filter(c=>c.homeworkId===h.id).length;

  return `<button class="hw-item" data-open="${h.id}">
    <div class="hw-icon">${icon(TYPE_ICONS[h.type])}</div>
    <div class="hw-main">
      <div class="hw-subject">${escapeHtml(h.subject)} <span class="tag tag-${h.type}" style="margin-left:6px;">${h.type}</span>${classTag}</div>
      <div class="hw-meta">${h.description? escapeHtml(h.description.length>70? h.description.slice(0,70)+'…' : h.description)+' &middot; ':''}By ${nameWithBadge(h.createdByName, h.createdByRole)} &middot; ${comments} comment${comments!==1?'s':''}${h.commentsEnabled? '':' &middot; comments off'}</div>
    </div>
    ${icon('chevron-right','color:var(--ink-soft);')}
  </button>`;
}
function bindAgenda(user){

    el.onclick = ()=>{ agendaSelectedDay = el.dataset.day; renderPage(); };
  });
  document.querySelectorAll('[data-open]').forEach(el=>{

  });

  if(addBtn) addBtn.onclick = ()=> openAddHomeworkModal(user);
}

/* ---------- CALENDAR (browse past days) ---------- */
let calendarDate = new Date();
function isSameCalendarDay(ts, d){
  const a = new Date(ts);
  return a.getFullYear()===d.getFullYear() && a.getMonth()===d.getMonth() && a.getDate()===d.getDate();
}
function isFutureOrToday(d){
  const t = new Date(); t.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  return dd.getTime() >= t.getTime();
}
function pageCalendar(user){
  const visible = visibleHomeworks(user);
  const items = visible.filter(h=>isSameCalendarDay(h.createdAt, calendarDate)).sort((a,b)=>b.createdAt-a.createdAt);
  const dow = calendarDate.toLocaleDateString('en-GB',{weekday:'long'});
  const dateStr = calendarDate.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  return `
    <div class="page-header">
      <div><h2>Calendar</h2><div class="sub">Look back on any day to catch up on what was posted.</div></div>
    </div>
    <div class="panel">
      <div class="cal-nav">
        <button class="cal-arrow" id="calPrev" title="Previous day">${icon('chevron-left')}</button>
        <div class="cal-date-box">
          <div class="cdow">${dow}</div>
          <div class="cdate">${dateStr}</div>
          ${new Date().toDateString()===calendarDate.toDateString() ? `<div class="cal-today-pill">TODAY</div>` : ''}
        </div>
        <button class="cal-arrow" id="calNext" title="Next day" ${isFutureOrToday(calendarDate)?'disabled':''}>${icon('chevron-right')}</button>
      </div>
      ${items.length? items.map(h=>hwItemRow(h)).join('') : emptyState('box-archive','Nothing was posted on this day.')}
    </div>`;
}
function bindCalendar(user){
  document.getElementById('calPrev').onclick = ()=>{
    calendarDate = new Date(calendarDate.getTime() - 86400000);
    renderPage();
  };
  const nextBtn = document.getElementById('calNext');
  if(nextBtn) nextBtn.onclick = ()=>{
    if(isFutureOrToday(calendarDate)) return;
    calendarDate = new Date(calendarDate.getTime() + 86400000);
    renderPage();
  };
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{ viewingHomeworkId = el.dataset.open; hwThreadStudentId=null; renderPage(); };
  });
}

/* Lightweight offline "spell check" -- catches common misspellings plus a
   couple of pattern-based heuristics, so the homework text gets a sanity
   pass before it posts. Not a real dictionary, but good enough to demo. */
const COMMON_MISSPELLINGS = {
  teh:"the", recieve:"receive", seperate:"separate", definately:"definitely", occured:"occurred",
  thier:"their", wich:"which", becuase:"because", adress:"address", arguement:"argument",
  begining:"beginning", calender:"calendar", cemetary:"cemetery", changable:"changeable",
  collegue:"colleague", comming:"coming", commitee:"committee", concious:"conscious",
  embarass:"embarrass", enviroment:"environment", existance:"existence", familar:"familiar",
  foriegn:"foreign", goverment:"government", gaurd:"guard", harrass:"harass",
  immediatly:"immediately", independant:"independent", knowlege:"knowledge", liason:"liaison",
  lisence:"license", maintainance:"maintenance", mispell:"misspell", neccessary:"necessary",
  noticable:"noticeable", occassion:"occasion", paralel:"parallel", persistant:"persistent",
  posession:"possession", priviledge:"privilege", publically:"publicly", recomend:"recommend",
  refered:"referred", relevent:"relevant", succesful:"successful", tommorow:"tomorrow",
  untill:"until", wether:"whether", writting:"writing", truely:"truly", suprise:"surprise",
  accomodate:"accommodate", alot:"a lot", excercise:"exercise", finaly:"finally",
  homwork:"homework", hoemwork:"homework", pagee:"page"
};
function findMistake(text){
  const words = text.match(/[A-Za-z']+/g) || [];
  for(const w of words){
    const fix = COMMON_MISSPELLINGS[w.toLowerCase()];
    if(fix) return { word:w, suggestion:fix, reason:'spelling' };
  }
  for(const w of words){
    if(w.length>=4 && /(.)\1\1/.test(w)) return { word:w, suggestion:null, reason:'spelling' };
  }
  for(const w of words){
    if(w.length>=4 && !/[aeiouAEIOU]/.test(w)) return { word:w, suggestion:null, reason:'spelling' };
  }
  return null;
}

function addHomeworkFormHtml(user, vals){
  const subjectOptions = (user.role==='teacher' ? [user.subject] : SUBJECTS)
    .map(s=>`<option value="${s}" ${vals.subject===s?'selected':''}>${s}</option>`).join('');
  return `
    <h3>Add homework</h3>
    ${vals.errorMsg? `<div class="form-error" style="display:block;">${vals.errorMsg}</div>` : ''}
    <div class="field"><label>Subject</label><select id="hwSubject">${subjectOptions}</select></div>
    <div class="field"><label>Type</label><select id="hwType">${TYPES.map(t=>`<option value="${t}" ${vals.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Day</label><select id="hwDay">${DAYS.map(d=>`<option value="${d}" ${(vals.day||agendaSelectedDay)===d?'selected':''}>${d}</option>`).join('')}</select></div>
    <div class="field"><label>Homework</label>
      <textarea id="hwDescription" rows="3" placeholder="e.g. Page 10, questions 1-5, reading exercise..." style="width:100%;padding:12px 14px;border-radius:var(--r-sm);border:2px solid ${vals.errorMsg?'var(--red)':'var(--line)'};background:var(--paper);font-size:14px;resize:vertical;">${escapeHtml(vals.description||'')}</textarea>
    </div>
    <div class="field"><label>Comments</label>
      <div class="toggle-pair">
        <button type="button" class="toggle-opt ${vals.commentsEnabled?'active':''}" data-c="enabled">Enabled</button>
        <button type="button" class="toggle-opt ${!vals.commentsEnabled?'active':''}" data-c="disabled">Disabled</button>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Grade</label><select id="hwGrade">${GRADES.map(g=>`<option value="${g}" ${String(vals.grade)===String(g)?'selected':''}>Grade ${g}</option>`).join('')}</select></div>
      <div class="field"><label>Section</label><select id="hwSection">${SECTIONS.map(s=>`<option value="${s}" ${vals.section===s?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <button class="btn btn-fill-red" id="hwPost" style="margin-top:6px;">Post</button>`;
}

function openAddHomeworkModal(user){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <button class="modal-close" id="mClose">${icon('xmark')}</button>
      <div id="mContent"></div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('mClose').onclick = ()=> overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

  let vals = {
    subject:(user.role==='teacher'? user.subject : SUBJECTS[0]), type:TYPES[0], day:agendaSelectedDay,
    description:'', commentsEnabled:true, grade:GRADES[0], section:SECTIONS[0], errorMsg:null
  };

  function readForm(){
    vals.subject = document.getElementById('hwSubject').value;
    vals.type = document.getElementById('hwType').value;
    vals.day = document.getElementById('hwDay').value;
    vals.description = document.getElementById('hwDescription').value.trim();
    vals.grade = document.getElementById('hwGrade').value;
    vals.section = document.getElementById('hwSection').value;
  }

  function renderForm(){
    const mContent = document.getElementById('mContent');
    mContent.innerHTML = addHomeworkFormHtml(user, vals);
    mContent.querySelectorAll('.toggle-opt').forEach(b=>{
      b.onclick = ()=>{
        mContent.querySelectorAll('.toggle-opt').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        vals.commentsEnabled = b.dataset.c === 'enabled';
      };
    });
    document.getElementById('hwPost').onclick = onSubmit;
  }

  function onSubmit(){
    readForm();
    vals.errorMsg = null;
    if(!vals.description){
      vals.errorMsg = 'Please write what the homework actually is.';
      renderForm();
      return;
    }
    document.getElementById('mContent').innerHTML = `
      <div class="loading-wrap">
        <div class="spinner"></div>
        <p>Qualifying homework...</p>
      </div>`;
    setTimeout(async ()=>{
      const mistake = findMistake(vals.description);
      if(mistake){
        vals.errorMsg = mistake.suggestion
          ? `Mistake found in spelling: "${mistake.word}" &mdash; did you mean "${mistake.suggestion}"?`
          : `Mistake found in spelling: "${mistake.word}" looks off. Please check it.`;
        renderForm();
        return;
      }
      const {data, error} = await sb.from('homework').insert({
        subject: vals.subject, type: vals.type, day: vals.day, description: vals.description,
        comments_enabled: vals.commentsEnabled,
        grade: parseInt(vals.grade,10), section: vals.section,
        created_by: user.id, created_by_name: user.name, created_by_role: user.role
      }).select().single();
      if(error){
        vals.errorMsg = 'Could not post to the server. Please try again.';
        renderForm();
        return;
      }
      const hw = mapHomework(data);
      if(!DB.homeworks.some(h=>h.id===hw.id)) DB.homeworks.push(hw);
      overlay.remove();
      toast('Homework posted.');
      renderPage();
    }, 1400);
  }

  renderForm();
}

let hwThreadStudentId = null; // which student's private thread staff/teacher is viewing
function pageHomeworkDetail(user, id){
  const hw = DB.homeworks.find(h=>h.id===id);
  if(!hw){ viewingHomeworkId=null; return pageAgenda(user); }
  const canDeleteHw = isStaff(user) || (user.role==='teacher' && hw.createdBy===user.id);

  let threadOwnerId, commentsForThread, studentPickerHtml = '';
  if(user.role==='student'){
    threadOwnerId = user.id;
    commentsForThread = DB.comments.filter(c=>c.homeworkId===id && c.studentId===user.id).sort((a,b)=>a.createdAt-b.createdAt);
  } else {
    const studentIds = [...new Set(DB.comments.filter(c=>c.homeworkId===id && c.studentId).map(c=>c.studentId))];
    const students = studentIds.map(sid=>{
      const u = DB.users.find(x=>x.id===sid);
      return { id:sid, name: u? u.name : 'Former student' };
    }).sort((a,b)=>a.name.localeCompare(b.name));
    if((hwThreadStudentId===null || !students.some(s=>s.id===hwThreadStudentId)) && students.length){
      hwThreadStudentId = students[0].id;
    }
    threadOwnerId = students.length ? hwThreadStudentId : null;
    commentsForThread = threadOwnerId
      ? DB.comments.filter(c=>c.homeworkId===id && c.studentId===threadOwnerId).sort((a,b)=>a.createdAt-b.createdAt)
      : [];
    studentPickerHtml = students.length ? `
      <div class="thread-picker">
        ${students.map(s=>`<button class="thread-pick-btn ${s.id===hwThreadStudentId?'active':''}" data-pickthread="${s.id}">${escapeHtml(s.name)}</button>`).join('')}
      </div>` : '';
  }

  return `
    <button class="back-link" id="hwBack">${icon('arrow-left')} Back</button>
    <div class="panel">
      <div class="hw-detail-head">
        <div>
          <span class="tag tag-${hw.type}">${hw.type}</span>
          ${hw.grade? `<span class="tag" style="background:var(--yellow-soft);color:#7a5a05;margin-left:6px;">Grade ${escapeHtml(String(hw.grade))}${hw.section?(' &middot; Sec '+escapeHtml(hw.section)):''}</span>`:''}
          <h2 style="margin:10px 0 4px;color:var(--red);">${escapeHtml(hw.subject)}</h2>
          <div class="sub">Posted by ${nameWithBadge(hw.createdByName, hw.createdByRole)} for ${hw.day} &middot; ${new Date(hw.createdAt).toLocaleString()}</div>
        </div>
        <div style="display:flex;gap:8px;">
          ${user.role==='student'? `<button class="btn btn-outline-red btn-sm" id="hwSaveJournal">${icon('bookmark')} Save</button>`:''}
          ${canDeleteHw? `<button class="btn btn-danger btn-sm" id="hwDelete">${icon('trash')} Delete homework</button>`:''}
        </div>
      </div>
      ${hw.description? `<div style="margin-top:16px;padding:16px 18px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);font-size:14.5px;line-height:1.6;white-space:pre-wrap;">${escapeHtml(hw.description)}</div>`:''}
    </div>
    <div class="panel">
      <h3>${user.role==='student' ? 'Your private thread with the teacher' : 'Student threads'}</h3>
      <div class="sub" style="margin:-6px 0 14px;">${icon('user-shield',`vertical-align:-2px;`)} Private &mdash; only you${user.role==='student'?', your teacher, and staff':' and this student'} can see it.</div>
      ${user.role!=='student' ? studentPickerHtml : ''}
      ${hw.commentsEnabled ? `
        ${user.role!=='student' && !threadOwnerId ? emptyState('comment-slash','No student has started a thread on this homework yet.') : `
          <div style="margin-bottom:16px;">
            ${commentsForThread.length? commentsForThread.map(c=>commentRow(c,user)).join('') : emptyState('comment-slash','No messages yet. Be the first!')}
          </div>
          <div class="add-comment-row">
            <button class="mini-btn" id="commentAttachBtn" title="Attach photo/video">${icon('paperclip')}</button>
            <input type="text" id="newComment" placeholder="Write a message... links work too">
            <button class="btn btn-fill-yellow btn-sm" id="postComment">Post</button>
          </div>
          <input type="file" id="commentMediaInput" accept="image/*,video/*" style="display:none;">
          <div id="commentMediaStatus" style="font-size:12px;color:var(--ink-soft);margin-top:6px;"></div>
        `}
      ` : `<div style="margin-top:4px;">${emptyState('comment-slash','Comments are disabled for this item.')}</div>`}
    </div>`;
}
function commentRow(c,user){
  const mine = c.authorId===user.id;
  return `<div class="comment">
    <div class="cavatar">${c.authorName.slice(0,2).toUpperCase()}</div>
    <div class="cbody">
      <div class="cname">${nameWithBadge(c.authorName, c.authorRole)}</div>
      ${c.text? `<div class="ctext">${linkifyText(c.text)}</div>`:''}
      ${mediaHtml(c.mediaUrl, c.mediaType, 'comment-media')}
      <div class="ctime">${new Date(c.createdAt).toLocaleString()}</div>
    </div>
    ${mine? `<button class="cdel" data-delc="${c.id}">${icon('trash')}</button>`:''}
  </div>`;
}
function bindHomeworkDetail(user){
  document.getElementById('hwBack').onclick = ()=>{ viewingHomeworkId=null; hwThreadStudentId=null; renderPage(); };
  const delBtn = document.getElementById('hwDelete');
  if(delBtn) delBtn.onclick = async ()=>{
    const id = viewingHomeworkId;
    const {error} = await sb.from('homework').delete().eq('id', id);
    if(error){ sbFail('deleteHomework', error); return; }
    DB.homeworks = DB.homeworks.filter(h=>h.id!==id);
    DB.comments = DB.comments.filter(c=>c.homeworkId!==id);
    toast('Homework deleted.');
    viewingHomeworkId = null; hwThreadStudentId=null;
    renderPage();
  };
  const saveBtn = document.getElementById('hwSaveJournal');
  if(saveBtn) saveBtn.onclick = ()=>{
    const hw = DB.homeworks.find(h=>h.id===viewingHomeworkId);
    if(hw) saveToJournal(user, 'saved_homework', `${hw.subject} (${hw.type})`, hw.description, 'homework', hw.id);
  };
  document.querySelectorAll('[data-pickthread]').forEach(el=>{
    el.onclick = ()=>{ hwThreadStudentId = el.dataset.pickthread; renderPage(); };
  });

  let pendingMedia = null;
  const mediaInput = document.getElementById('commentMediaInput');
  const attachBtn = document.getElementById('commentAttachBtn');
  if(attachBtn) attachBtn.onclick = ()=> mediaInput.click();
  if(mediaInput) mediaInput.onchange = async ()=>{
    const status = document.getElementById('commentMediaStatus');
    try{
      pendingMedia = await pickMediaFile(mediaInput.files[0]);
      status.textContent = `${pendingMedia.type==='video'?'Video':'Photo'} attached -- will send with your next message.`;
      status.style.color = 'var(--red)';
    } catch(e){ status.textContent = e.message; status.style.color = 'var(--red)'; pendingMedia = null; }
  };

  const postBtn = document.getElementById('postComment');
  if(postBtn){
    postBtn.onclick = async ()=>{
      const input = document.getElementById('newComment');
      const text = input.value.trim();
      if(!text && !pendingMedia) return;
      const studentId = user.role==='student' ? user.id : hwThreadStudentId;
      if(!studentId) return;
      postBtn.disabled = true;
      const {data, error} = await sb.from('homework_comments').insert({
        homework_id: viewingHomeworkId, student_id: studentId,
        author_id: user.id, author_name: user.name, author_role: user.role,
        body: text || null, media_url: pendingMedia? pendingMedia.dataUrl : null,
        media_type: pendingMedia? pendingMedia.type : null
      }).select().single();
      postBtn.disabled = false;
      if(error){ sbFail('addComment', error); return; }
      const c = mapComment(data);
      if(!DB.comments.some(x=>x.id===c.id)) DB.comments.push(c);
      input.value = ''; pendingMedia = null;
      renderPage();
    };
  }
  document.querySelectorAll('[data-delc]').forEach(el=>{
    el.onclick = async ()=>{
      const cid = el.dataset.delc;
      const {error} = await sb.from('homework_comments').delete().eq('id', cid);
      if(error){ sbFail('deleteComment', error); return; }
      DB.comments = DB.comments.filter(c=>c.id!==cid);
      renderPage();
    };
  });
}

/* ---------- POSTS (answer sheets, exam scores, announcements, images) ---------- */
function resizeImageToDataUrl(file, maxW){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---- Shared across Homework Proof, Class Chat, and homework comments ----
   There's no file storage wired up yet, so media still travels as a data
   URL in the row itself (same approach Posts already uses). Images get
   resized down; video is size-capped since it has to fit in a DB column. */
const MAX_VIDEO_MB = 12;
function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=> resolve(reader.result);
    reader.readAsDataURL(file);
  });
}
async function pickMediaFile(file){
  if(!file) return null;
  if(file.type.startsWith('image/')) return { dataUrl: await resizeImageToDataUrl(file, 1000), type:'image' };
  if(file.type.startsWith('video/')){
    if(file.size > MAX_VIDEO_MB*1024*1024) throw new Error(`Videos are limited to ${MAX_VIDEO_MB}MB -- try a shorter clip.`);
    return { dataUrl: await readFileAsDataUrl(file), type:'video' };
  }
  throw new Error('Please choose a photo or video file.');
}
/* Turns http(s) links in a message into clickable text; everything else is
   escaped first so a message can never inject markup. */
function linkifyText(text){
  const escaped = escapeHtml(text);
  return escaped.replace(/(https?:\/\/[^\s<]+)/g, url=>{
    const clean = url.replace(/[.,!?)]+$/,'');
    const trail = url.slice(clean.length);
    return `<a href="${clean}" target="_blank" rel="noopener noreferrer" style="color:var(--red);font-weight:700;text-decoration:underline;">${clean}</a>${trail}`;
  });
}
function mediaHtml(mediaUrl, mediaType, cls){
  if(!mediaUrl) return '';
  if(mediaType==='video') return `<video class="${cls}" src="${mediaUrl}" controls playsinline></video>`;
  return `<img class="${cls}" src="${mediaUrl}" alt="attachment" data-lightbox-media="${mediaType||'image'}">`;
}

  </div>`;
}
function openImageLightbox(src, alt){
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = `
    <button class="lightbox-close">${icon('xmark')}</button>
    <img src="${src}" alt="${escapeHtml(alt||'')}">`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('.lightbox-close').onclick = close;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
}
/* Any image rendered via mediaHtml() (chat, comments, journal, homework
   proof) opens full-screen on a single click -- one delegated listener
   covers every current and future spot that uses it. */
document.addEventListener('click', (e)=>{
